<!doctype html>
<!-- Daleel Phase-2 dashboard. Owner: C (ticket C4).
     Reads ONLY /api/metrics, which aggregates the anonymised `metadata` table
     (topic, caza, language, outcome, day). No transcripts, no phone numbers, no names
     ever reach this page. /api/metrics?demo=1 serves synthetic rows (never stored).
     Fonts: Hanken Grotesk + Archivo from Google Fonts; offline the system sans-serif is used. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Daleel Service Overview</title>
<link rel="icon" href="data:,"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"/>
<style>
  /* Olive green on warm beige. Every text and chart-mark colour is >= 4.5:1 on its background.
     light on #F4EFE4 / card #FCFAF4:  ink 12.6/13.9  ink-2 7.4/8.1  quiet 5.4/6.0  olive 6.2/6.8  attention 5.4/6.0
     dark  on #171A10 / card #20241A:  ink 15.1/13.6  ink-2 11.3/10.2  quiet 8.1/7.3  olive 9.3/8.3  attention 8.1/7.3 */
  :root{
    color-scheme: light;
    --bg:#F4EFE4; --card:#FCFAF4; --line:#E3DCCB; --track:#E6E8D3;
    --ink:#272B1C; --ink-2:#4A4F3A; --quiet:#5E634D;
    --olive:#4F5E1F; --on-olive:#FCFAF4; --attention:#9A4A1E; --good:#3F6B1F; --bad:#A23B1C;
    --focus:#0B4FB3;
    --gap:44px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#171A10; --card:#20241A; --line:#343A28; --track:#2F3524;
      --ink:#F0EEE2; --ink-2:#CFD1BE; --quiet:#AEB29C;
      --olive:#B5C46B; --on-olive:#171A10; --attention:#E8A06A; --good:#A9D27A; --bad:#F0937A;
      --focus:#8DB8FF;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#171A10; --card:#20241A; --line:#343A28; --track:#2F3524;
    --ink:#F0EEE2; --ink-2:#CFD1BE; --quiet:#AEB29C;
    --olive:#B5C46B; --on-olive:#171A10; --attention:#E8A06A; --good:#A9D27A; --bad:#F0937A;
    --focus:#8DB8FF;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
    font-size:17px; line-height:1.6; font-variant-numeric:tabular-nums;
  }
  h1,h2,.num-big,.tile .value{font-family:Archivo,"Hanken Grotesk",system-ui,sans-serif}
  :focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:6px}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .skip{position:absolute; inset-inline-start:8px; top:-60px; background:var(--card); color:var(--ink);
        padding:10px 14px; border:2px solid var(--ink); border-radius:8px; z-index:20}
  .skip:focus{top:8px}
  .wrap{max-width:68rem; margin:0 auto; padding:0 24px 72px}
  a{color:var(--olive)}

  /* ---- slim ministry bar ---- */
  .masthead{padding:14px 24px; border-bottom:1px solid var(--line)}
  .lockup{display:flex; align-items:center; gap:14px; max-width:68rem; margin-inline:auto; flex-wrap:wrap}
  .cedar{width:28px; height:28px; flex:none; fill:var(--olive); display:block}
  .titles{display:flex; flex-direction:column; line-height:1.25; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2)}
  .svc{font-size:20px; font-weight:700}
  .grow{flex:1}
  .chatlink{display:inline-flex; align-items:center; min-height:44px; font-weight:600}

  /* ---- page head ---- */
  .top{display:flex; align-items:flex-end; gap:20px 24px; flex-wrap:wrap; padding-top:48px}
  h1{font-size:40px; line-height:1.1; margin:0; font-weight:800; letter-spacing:-.02em}
  .subtitle{color:var(--quiet); margin:10px 0 0}
  .top > div:first-child{max-width:32rem}
  .actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .btn{
    font:inherit; font-size:16px; font-weight:600; min-height:44px; min-width:44px; padding:8px 20px; cursor:pointer;
    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:999px;
  }
  .btn:hover{border-color:var(--olive); color:var(--olive)}
  .pill{display:inline-flex; align-items:center; min-height:44px; padding:6px 18px; border-radius:999px;
        background:var(--olive); color:var(--on-olive); font-weight:600}
  .updated{color:var(--quiet); font-size:15px; margin:12px 0 0}

  .banner{margin-top:28px; padding:14px 20px; border-radius:14px; background:var(--card); border:1px solid var(--attention); color:var(--ink)}
  .banner strong{color:var(--attention)}
  .summary{font-size:24px; line-height:1.4; margin:var(--gap) 0 0; max-width:46rem; font-family:Archivo,"Hanken Grotesk",sans-serif; font-weight:500}
  .privacy{color:var(--quiet); font-size:16px; margin:12px 0 0}

  /* ---- stat cards ---- */
  .stats{display:grid; gap:24px; grid-template-columns:repeat(3,1fr); margin-top:var(--gap)}
  .stats.urgent{grid-template-columns:repeat(2,1fr); margin-top:24px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:30px 30px 28px}
  .tile h2{font-size:17px; font-weight:600; margin:0; color:var(--ink-2); font-family:"Hanken Grotesk",sans-serif}
  .tile .value{font-size:56px; font-weight:800; line-height:1.05; margin:14px 0 6px; letter-spacing:-.03em}
  .tile .detail{margin:0; color:var(--quiet); font-size:16px}
  .tile.hero{background:var(--olive); border-color:var(--olive); color:var(--on-olive)}
  .tile.hero h2,.tile.hero .detail{color:var(--on-olive)}
  .stats.urgent .tile .value{font-size:44px}
  .meter{height:12px; border-radius:999px; background:var(--track); margin-top:18px; overflow:hidden}
  .meter > span{display:block; height:100%; border-radius:999px; background:var(--olive)}
  .meter.attn > span{background:var(--attention)}
  .verdict{font-size:16px; font-weight:600; margin:14px 0 0}
  .verdict.ok{color:var(--good)} .verdict.bad{color:var(--bad)}

  /* ---- section cards ---- */
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:24px; margin-top:var(--gap)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:32px 32px 28px; margin-top:var(--gap)}
  .grid2 > .card{margin-top:0}
  .card h2{font-size:24px; line-height:1.25; margin:0; font-weight:700; letter-spacing:-.01em}
  .takeaway{color:var(--ink-2); margin:8px 0 28px}
  .hidden-note{font-size:15px; color:var(--quiet); margin:20px 0 0}
  .meta{font-size:14px; color:var(--quiet); margin:24px 0 0}

  /* ---- bars: name and value on one line, a thick rounded bar below ---- */
  .bars{display:flex; flex-direction:column; gap:22px}
  .rowtop{display:flex; justify-content:space-between; gap:16px; align-items:baseline}
  .rowtop .name{font-weight:500}
  .rowtop .val{font-weight:700; font-family:Archivo,sans-serif}
  .track{height:14px; border-radius:999px; background:var(--track); margin-top:8px; overflow:hidden}
  .bar{height:100%; border-radius:999px; background:var(--olive); min-width:6px}
  .bars.attn .bar{background:var(--attention)}
  .row.other .name{color:var(--quiet)}
  .row.other .bar{background:repeating-linear-gradient(135deg,var(--quiet) 0 3px,transparent 3px 7px)}

  /* ---- line chart ---- */
  .chart{width:100%}
  .chart svg{display:block; max-width:100%; overflow:visible}
  .chart text{fill:var(--quiet); font-size:14px; font-family:inherit}
  .chart text.v{fill:var(--ink); font-weight:700; font-size:15px}
  .chart .grid{stroke:var(--line); stroke-width:1}
  .chart .axis{stroke:var(--quiet); stroke-width:1}
  .chart .area{fill:var(--olive); opacity:.12}
  .chart .line{fill:none; stroke:var(--olive); stroke-width:3.5; stroke-linejoin:round}
  .chart .avg{fill:none; stroke:var(--quiet); stroke-width:2; stroke-dasharray:6 6}
  .chart .pt{fill:var(--card); stroke:var(--olive); stroke-width:3}
  .legend{font-size:15px; color:var(--quiet); margin:14px 0 0; display:flex; gap:24px; flex-wrap:wrap}
  .legend span::before{content:""; display:inline-block; width:26px; height:0; vertical-align:middle; margin-inline-end:8px; border-top:3px solid var(--olive)}
  .legend span.dash::before{border-top:2px dashed var(--quiet)}

  .cardhead{display:flex; justify-content:space-between; align-items:flex-start; gap:16px 24px; flex-wrap:wrap}
  .seg{display:inline-flex; background:var(--track); border-radius:999px; padding:4px; gap:4px}
  .segbtn{font:inherit; font-size:15px; font-weight:600; min-height:44px; padding:6px 18px; border:0; border-radius:999px;
          background:transparent; color:var(--ink); cursor:pointer}
  .segbtn[aria-pressed="true"]{background:var(--olive); color:var(--on-olive)}
  .segbtn:not([aria-pressed="true"]):hover{color:var(--olive)}
  /* ---- about + states ---- */
  .about ul{margin:16px 0 0; padding-inline-start:22px; color:var(--ink-2)}
  .about li{margin:10px 0}
  .skeleton{display:grid; gap:24px; margin-top:var(--gap)}
  .skeleton div{height:140px; border-radius:22px; background:linear-gradient(90deg,var(--card),var(--track),var(--card)); background-size:200% 100%; animation:sk 1.4s linear infinite}
  @keyframes sk{to{background-position:-200% 0}}
  .error{border:2px solid var(--bad); border-radius:22px; padding:28px; margin-top:var(--gap); background:var(--card)}
  .error h2{margin:0 0 8px; font-size:22px}
  .foot{color:var(--quiet); font-size:15px; margin-top:var(--gap); padding-top:24px; border-top:1px solid var(--line)}
  @media (max-width:880px){
    .stats,.stats.urgent,.grid2{grid-template-columns:1fr}
    h1{font-size:32px} .summary{font-size:21px}
    .card{padding:26px 22px 24px} .tile{padding:26px 24px}
    :root{--gap:36px}
  }
  @media (max-width:520px){ .wrap,.masthead{padding-inline:16px} .tile .value{font-size:46px} }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to the statistics</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="cedar" viewBox="0 0 64 64">
  <path d="M32 3 L21.5 17h5.5L18.5 29h6L10 43h18.5v18h7V43H54L39.5 29h6L37 17h5.5Z"/>
</symbol></svg>

<header class="masthead">
  <div class="lockup">
    <svg class="cedar" aria-hidden="true"><use href="#cedar"/></svg>
    <div class="titles"><span>Republic of Lebanon</span><span>Ministry of Public Health</span></div>
    <span class="svc" lang="ar">دليل</span>
    <div class="grow"></div>
    <a class="chatlink" href="/">Open the chat service</a>
  </div>
</header>

<div class="wrap">
  <main>
    <div class="top">
      <div>
        <h1>Service overview</h1>
        <p class="subtitle" id="tagline"></p>
      </div>
      <div class="grow"></div>
      <div class="actions">
        <span class="pill" id="period" hidden></span>
        <button class="btn" id="demo" type="button" hidden></button>
        <button class="btn" id="theme" type="button"></button>
        <button class="btn" id="refresh" type="button"></button>
      </div>
    </div>
    <p class="updated" id="updated"></p>

    <div id="banner" class="banner" role="status" hidden></div>
    <div id="content" tabindex="-1" aria-busy="true"></div>
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
"use strict";

/* Every user-facing string lives here, so a translation is one more object (Arabic is the next priority). */
const T = {
  tagline: "Anonymised question statistics. No transcripts, phone numbers or names.",
  refresh: "Refresh", dark: "Dark mode", light: "Light mode",
  demoOn: "Show demo data", demoOff: "Show real data",
  loading: "Loading statistics…", updated: "Last updated", loaded: "Statistics updated.",
  errTitle: "The statistics could not be loaded", errBody: "Check your connection, then try again.", retry: "Retry",
  demoBanner: "Demo data, not real citizen questions.",
  demoBannerMock: " The database has no records yet, so these figures are illustrative.",
  sparse: (n, k) => `Too few records to show yet. The service has handled ${n} question${n === 1 ? "" : "s"} so far. Breakdowns appear once a group reaches ${k}.`,
  privacy: (k) => `Groups of fewer than ${k} questions are combined as “Other (under ${k})” to protect privacy.`,
  other: (k) => `Other (under ${k})`,
  demoSource: "Demo data", realSource: "Daleel metadata",
  headline: {
    total: "Questions handled",
    answered: "Answered with an official source",
    noSource: "No official answer found",
    emergency: "Emergency routed (Red Cross 140)",
    person: "Escalated to a person (1787 / 1214 / 1564)",
  },
  target: { answeredMin: (t) => `Target: at least ${t}%`, noSourceMax: (t) => `Target: under ${t}%`, met: "Within target", missed: "Not within target" },
  view: { label: "Level of detail", topic: "By topic", kind: "By kind" },
  kindPrefix: { procedures: "Papers", drug_price: "Medicines", directory: "Places" },
  sub: {
    unspecified: "Not specified",
    health_coverage_card: "Health coverage card", chronic_medication_approval: "Chronic medication approval",
    hospital_admission: "Hospital admission", medical_certificate: "Medical certificate", disability_card: "Disability card",
    vaccination: "Vaccination", primary_care_registration: "Primary care registration", other_paper: "Other papers",
    cancer: "Cancer", diabetes: "Diabetes", heart_blood_pressure: "Heart and blood pressure", pain_fever: "Pain and fever",
    antibiotics: "Antibiotics", mental_health: "Mental health", asthma_allergy: "Asthma and allergy", stomach: "Stomach",
    other_medicine: "Other medicines", pharmacy: "Pharmacy", hospital: "Hospital", health_center: "Health centre", other_place: "Other places",
  },
  topic: {
    procedures: "Procedures and papers", directory: "Pharmacy, hospital or clinic",
    drug_price: "Medicine prices", dosing_request: "Dosing questions (declined)",
    emergency: "Emergencies", other: "Other topics", unspecified: "Not specified",
  },
  lang: { ar: "Arabic script", arabizi: "Arabizi", fr: "French", en: "English", unspecified: "Not specified" },
  sections: {
    topics:   { title: "What people ask about", hidden: "Appears on its own once 5 or more questions share it." },
    language: { title: "Languages", hidden: "Appears on its own once 5 or more questions use a language." },
    volume:   { title: "Questions per day" },
    cazas:    { title: "Where questions come from", hidden: "A district appears on its own once 5 or more questions come from it." },
  },
  aboutTitle: "How these numbers are calculated",
  about: [
    "Questions handled: every recorded question in the period.",
    "Answered with an official source: answered questions ÷ all questions.",
    "No official answer found: questions that fell back to the hotline ÷ all questions.",
    "Emergency routed and escalated: questions the safety rules or the hotline handed to a person.",
    "Privacy: only the day is stored, never the time. No names, numbers or messages are kept.",
  ],
  foot: "This page is built to WCAG 2.2 AA. To report an accessibility problem, contact the Daleel team at the Ministry of Public Health.",
};

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
};
const svgEl = (tag, attrs, text) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
};
const num = (n) => Number(n).toLocaleString("en-US");
const dayFmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const shortFmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
const asDate = (iso) => new Date(iso + "T00:00:00Z");
const fmtDay = (iso) => dayFmt.format(asDate(iso));
const fmtShort = (iso) => shortFmt.format(asDate(iso));
const pctOf = (part, whole) => whole ? Math.round(1000 * part / whole) / 10 : 0;
const topicName = (k) => T.topic[k] || (String(k).charAt(0).toUpperCase() + String(k).slice(1).replace(/_/g, " "));
const langName = (k) => T.lang[k] || String(k);
const plural = (n, w) => `${num(n)} ${w}${n === 1 ? "" : "s"}`;

function periodText(m){
  if (!m.period) return "—";
  return m.period.start === m.period.end ? fmtDay(m.period.start) : `${fmtDay(m.period.start)} – ${fmtDay(m.period.end)}`;
}

/* ---- tally rows -> chart items. The `other` entry is the privacy merge. ---- */
function tallyItems(list, nameFn, k){
  return (list || []).map((t) => t.suppressed
    ? { name: T.other(k), count: t.count, other: true, groups: t.groups }
    : { name: nameFn(t.label), count: t.count, key: t.label });
}
function hiddenNote(items, text){
  if (!items.some((i) => i.other)) return null;
  return el("p", "hidden-note", "Small groups are combined. " + (text || ""));
}

/* ---- section scaffold: title, one short sentence, chart, source line ---- */
function section(id, title, takeaway){
  const s = el("section", "card");
  s.id = id;
  s.setAttribute("aria-labelledby", id + "-h");
  const h = el("h2", null, title); h.id = id + "-h";
  s.appendChild(h);
  s.appendChild(el("p", "takeaway", takeaway));
  return s;
}
function addMeta(s, m){
  s.appendChild(el("p", "meta", `${m.source === "metadata" ? T.realSource : T.demoSource} · ${periodText(m)}`));
}

/* "procedures|hospital_admission" -> "Papers · Hospital admission". Topics without kinds keep their topic name. */
function kindName(label){
  const [t, sub] = String(label).split("|");
  const pre = T.kindPrefix[t];
  if (!pre) return topicName(t);
  return `${pre} · ${sub ? (T.sub[sub] || topicName(sub)) : T.sub.unspecified}`;
}

/* One card, two levels of detail behind a labelled switch: By topic / By kind (which papers, which medicines). */
function viewCard(id, title, views, attn){
  const s = el("section", "card");
  s.id = id;
  s.setAttribute("aria-labelledby", id + "-h");
  const head = el("div", "cardhead");
  const h = el("h2", null, title); h.id = id + "-h";
  head.appendChild(h);
  const seg = el("div", "seg");
  seg.setAttribute("role", "group");
  seg.setAttribute("aria-label", T.view.label);
  head.appendChild(seg);
  s.appendChild(head);
  const buttons = [], panels = [];
  views.forEach((v, i) => {
    const b = el("button", "segbtn", v.label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(i === 0));
    seg.appendChild(b); buttons.push(b);
    const panel = el("div", "view");
    panel.hidden = i !== 0;
    panel.appendChild(el("p", "takeaway", v.takeaway));
    if (v.items.length) panel.appendChild(barList(v.items, "questions", attn));
    const hn = hiddenNote(v.items, v.hidden); if (hn) panel.appendChild(hn);
    s.appendChild(panel); panels.push(panel);
    b.addEventListener("click", () => {
      buttons.forEach((x, j) => x.setAttribute("aria-pressed", String(j === i)));
      panels.forEach((p, j) => { p.hidden = j !== i; });
    });
  });
  return s;
}

/* ---- charts ---- */
function barList(items, unit, attn){
  const max = Math.max(...items.map((i) => i.count), 1);
  const box = el("div", "bars" + (attn ? " attn" : ""));
  box.setAttribute("role", "list");
  for (const it of items){
    const row = el("div", "row" + (it.other ? " other" : ""));
    row.setAttribute("role", "listitem");
    const top = el("div", "rowtop");
    top.appendChild(el("span", "name", it.name));
    const v = el("span", "val", num(it.count));
    v.setAttribute("aria-label", `${num(it.count)} ${unit}`);
    top.appendChild(v);
    row.appendChild(top);
    const track = el("div", "track"); track.setAttribute("aria-hidden", "true");
    const bar = el("div", "bar"); bar.style.width = Math.max(1, (it.count / max) * 100) + "%";
    track.appendChild(bar); row.appendChild(track);
    box.appendChild(row);
  }
  return box;
}

function niceMax(v){
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1))));
  let m = 10 * p;
  for (const k of [1, 2, 5, 10]) if (k * p >= v){ m = k * p; break; }
  return m % 2 ? m + 1 : m;          // even, so the middle gridline is a whole number
}

function lineChart(days, label){
  const box = el("div", "chart");
  const n = days.length;
  const avg = days.reduce((a, d) => a + d.count, 0) / n;
  const draw = () => {
    box.textContent = "";
    const W = Math.max(box.clientWidth || 320, 260), H = 260;
    const mg = { l: 46, r: 24, t: 34, b: 44 };
    const pw = W - mg.l - mg.r, ph = H - mg.t - mg.b;
    const max = niceMax(Math.max(...days.map((d) => d.count), 1));
    const x = (i) => mg.l + (n === 1 ? pw / 2 : (pw * i) / (n - 1));
    const y = (v) => mg.t + ph - (v / max) * ph;
    const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label });
    svg.appendChild(svgEl("title", {}, label));
    for (const v of [0, max / 2, max]){
      svg.appendChild(svgEl("line", { x1: mg.l, x2: W - mg.r, y1: y(v), y2: y(v), class: v === 0 ? "axis" : "grid" }));
      svg.appendChild(svgEl("text", { x: mg.l - 10, y: y(v) + 5, "text-anchor": "end" }, num(Math.round(v * 10) / 10)));
    }
    if (n > 1){
      const pts = days.map((d, i) => `${x(i)},${y(d.count)}`).join(" ");
      svg.appendChild(svgEl("polygon", { class: "area", points: `${x(0)},${y(0)} ${pts} ${x(n - 1)},${y(0)}` }));
      svg.appendChild(svgEl("line", { x1: mg.l, x2: W - mg.r, y1: y(avg), y2: y(avg), class: "avg" }));
      svg.appendChild(svgEl("polyline", { class: "line", points: pts }));
    }
    let maxI = 0;
    days.forEach((d, i) => { if (d.count > days[maxI].count) maxI = i; });
    days.forEach((d, i) => {
      svg.appendChild(svgEl("circle", { class: "pt", cx: x(i), cy: y(d.count), r: n > 14 ? 3.5 : 5.5 }));
      if (n <= 10 || i === maxI || i === n - 1)
        svg.appendChild(svgEl("text", { class: "v", x: x(i), y: y(d.count) - 12, "text-anchor": "middle" }, num(d.count)));
    });
    const step = n > 1 ? Math.max(1, Math.ceil(70 / (pw / (n - 1)))) : 1;
    const ticks = [];
    for (let i = 0; i < n; i += step) ticks.push(i);
    if (ticks[ticks.length - 1] !== n - 1){
      if (n - 1 - ticks[ticks.length - 1] >= step * 0.6) ticks.push(n - 1);
      else ticks[ticks.length - 1] = n - 1;
    }
    for (const i of ticks)
      svg.appendChild(svgEl("text", { x: x(i), y: H - 14, "text-anchor": "middle" }, fmtShort(days[i].label)));
    box.appendChild(svg);
  };
  draw();
  if (typeof ResizeObserver !== "undefined"){
    let last = box.clientWidth;
    new ResizeObserver(() => { if (box.clientWidth !== last){ last = box.clientWidth; draw(); } }).observe(box);
  }
  const wrap = el("div");
  wrap.appendChild(box);
  const lg = el("p", "legend");
  lg.appendChild(el("span", null, "Questions per day"));
  if (n > 1) lg.appendChild(el("span", "dash", `Average: ${Math.round(avg * 10) / 10} a day`));
  wrap.appendChild(lg);
  return wrap;
}

/* ---- stat cards ---- */
function tile(title, value, detail, opts){
  opts = opts || {};
  const t = el("div", "tile" + (opts.hero ? " hero" : ""));
  t.appendChild(el("h2", null, title));
  t.appendChild(el("p", "value", value));
  t.appendChild(el("p", "detail", detail));
  if (opts.meter != null){
    const m = el("div", "meter" + (opts.attn ? " attn" : ""));
    m.setAttribute("role", "img");
    m.setAttribute("aria-label", `${opts.meter}% of questions`);
    const f = el("span"); f.style.width = Math.min(100, opts.meter) + "%";
    m.appendChild(f); t.appendChild(m);
  }
  if (opts.verdict) t.appendChild(el("p", "verdict " + (opts.verdict.ok ? "ok" : "bad"), `${opts.verdict.ok ? "✓" : "!"} ${opts.verdict.text}`));
  return t;
}

function summarySentence(m, topicItems){
  const total = m.total_turns;
  if (!total) return "No questions have been recorded yet.";
  const lead = topicItems.find((i) => !i.other);
  let s = `Daleel handled ${plural(total, "question")}. ${pctOf(m.outcome_counts.answered, total)}% had an official answer.`;
  if (lead) s += ` Most were about ${lead.name.toLowerCase()}.`;
  return s;
}

/* ---- render ---- */
function render(m){
  const content = document.getElementById("content");
  content.textContent = "";
  const k = m.min_cell || 5;
  const total = m.total_turns;
  const oc = m.outcome_counts;

  const period = document.getElementById("period");
  period.hidden = !m.period;
  period.textContent = periodText(m);

  const banner = document.getElementById("banner");
  const demo = m.source === "demo" || m.source === "mock";
  banner.hidden = !(demo || m.sparse);
  banner.textContent = "";
  if (demo){
    banner.appendChild(el("strong", null, T.demoBanner));
    if (m.source === "mock") banner.appendChild(document.createTextNode(T.demoBannerMock));
  } else if (m.sparse){
    banner.appendChild(document.createTextNode(T.sparse(total, k)));
  }

  const topicItems = tallyItems(m.topics, topicName, k);
  content.appendChild(el("p", "summary", summarySentence(m, topicItems)));
  content.appendChild(el("p", "privacy", T.privacy(k)));

  /* headline numbers: all from outcome_counts, and the urgent cards below */
  const tg = m.targets || {};
  const ansPct = pctOf(oc.answered, total), noPct = pctOf(oc.unanswered, total);
  const vAns = tg.answered_min != null ? { ok: ansPct >= tg.answered_min, text: `${T.target.answeredMin(tg.answered_min)}. ${ansPct >= tg.answered_min ? T.target.met : T.target.missed}` } : null;
  const vNo = tg.no_source_max != null ? { ok: noPct <= tg.no_source_max, text: `${T.target.noSourceMax(tg.no_source_max)}. ${noPct <= tg.no_source_max ? T.target.met : T.target.missed}` } : null;
  const days = m.days || [];
  const stats = el("div", "stats");
  stats.appendChild(tile(T.headline.total, num(total), `${plural(days.length, "day")} of activity`, { hero: true }));
  stats.appendChild(tile(T.headline.answered, ansPct + "%", `${num(oc.answered)} of ${num(total)} questions`, { meter: ansPct, verdict: vAns }));
  stats.appendChild(tile(T.headline.noSource, noPct + "%", `${num(oc.unanswered)} of ${num(total)} questions`, { meter: noPct, attn: true, verdict: vNo }));
  content.appendChild(stats);
  const urgent = el("div", "stats urgent");
  urgent.appendChild(tile(T.headline.emergency, num(oc.emergency), `${pctOf(oc.emergency, total)}% of questions`));
  urgent.appendChild(tile(T.headline.person, num(oc.escalated), `${pctOf(oc.escalated, total)}% of questions`));
  content.appendChild(urgent);

  /* topics: by topic, or by kind of paper / medicine / place */
  const kindItems = tallyItems(m.topic_kinds, kindName, k);
  const mostAsked = (items) => { const l = items.find((i) => !i.other); return l ? `Most asked: ${l.name} (${plural(l.count, "question")}).` : "Too few questions to rank yet."; };
  const topics = viewCard("topics", T.sections.topics.title, [
    { key: "topic", label: T.view.topic, items: topicItems, takeaway: mostAsked(topicItems), hidden: T.sections.topics.hidden },
    { key: "kind", label: T.view.kind, items: kindItems, takeaway: mostAsked(kindItems), hidden: T.sections.topics.hidden },
  ]);
  addMeta(topics, m);
  /* languages */
  const langs = (() => {
    const items = tallyItems(m.languages, langName, k);
    const lead = items.find((i) => !i.other);
    const s = section("language", T.sections.language.title, lead
      ? `${lead.name} is the most used: ${pctOf(lead.count, total)}% of questions.`
      : "Too few questions per language to split yet.");
    s.appendChild(barList(items, "questions"));
    const hn = hiddenNote(items, T.sections.language.hidden); if (hn) s.appendChild(hn);
    addMeta(s, m); return s;
  })();
  const g1 = el("div", "grid2"); g1.appendChild(topics); g1.appendChild(langs);
  content.appendChild(g1);

  /* daily volume */
  {
    let take = "No days recorded yet.";
    if (days.length === 1) take = `One day of data: ${plural(days[0].count, "question")} on ${fmtDay(days[0].label)}.`;
    else if (days.length){
      const best = days.reduce((a, d) => d.count > a.count ? d : a, days[0]);
      take = `Busiest day: ${fmtDay(best.label)}, with ${num(best.count)} questions.`;
    }
    const s = section("volume", T.sections.volume.title, take);
    if (days.length) s.appendChild(lineChart(days, take));
    addMeta(s, m); content.appendChild(s);
  }

  /* districts */
  {
    const items = tallyItems(m.cazas, (c) => c === "unspecified" ? T.lang.unspecified : c, k);
    const lead = items.find((i) => !i.other);
    const s = section("cazas", T.sections.cazas.title, lead
      ? `${lead.name} had the most questions: ${num(lead.count)}. Only the district is recorded, never an exact place.`
      : "Too few questions per district to rank yet.");
    s.appendChild(barList(items, "questions"));
    const hn = hiddenNote(items, T.sections.cazas.hidden); if (hn) s.appendChild(hn);
    addMeta(s, m); content.appendChild(s);
  }

  /* how it is calculated: once, at the bottom */
  const about = el("section", "card about");
  about.setAttribute("aria-labelledby", "about-h");
  const ah = el("h2", null, T.aboutTitle); ah.id = "about-h";
  about.appendChild(ah);
  const ul = el("ul");
  T.about.forEach((t) => ul.appendChild(el("li", null, t)));
  about.appendChild(ul);
  content.appendChild(about);
}

/* ---- loading, errors, demo toggle ---- */
const live = (msg) => { document.getElementById("live").textContent = msg; };
const wantDemo = () => new URLSearchParams(location.search).get("demo") === "1";

function skeleton(){
  const c = document.getElementById("content");
  c.textContent = "";
  c.setAttribute("aria-busy", "true");
  const sk = el("div", "skeleton"); sk.setAttribute("aria-hidden", "true");
  for (let i = 0; i < 3; i++) sk.appendChild(el("div"));
  c.appendChild(sk);
  live(T.loading);
}

async function load(){
  skeleton();
  const demoBtn = document.getElementById("demo");
  try {
    const r = await fetch("/api/metrics" + (wantDemo() ? "?demo=1" : ""));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const m = await r.json();
    render(m);
    document.getElementById("content").setAttribute("aria-busy", "false");
    document.getElementById("updated").textContent = `${T.updated}: ${new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;
    demoBtn.hidden = m.source === "demo" && !wantDemo();          // a server-wide demo flag cannot be switched off here
    demoBtn.textContent = wantDemo() ? T.demoOff : T.demoOn;
    live(T.loaded);
  } catch (err){
    const c = document.getElementById("content");
    c.textContent = "";
    c.setAttribute("aria-busy", "false");
    document.getElementById("banner").hidden = true;
    document.getElementById("period").hidden = true;
    const box = el("div", "error"); box.setAttribute("role", "alert");
    box.appendChild(el("h2", null, T.errTitle));
    box.appendChild(el("p", null, T.errBody));
    const b = el("button", "btn", T.retry); b.type = "button"; b.addEventListener("click", load);
    box.appendChild(b); c.appendChild(box);
    live(T.errTitle);
  }
}

document.getElementById("tagline").textContent = T.tagline;
document.getElementById("refresh").textContent = T.refresh;
document.getElementById("foot").textContent = T.foot;
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("demo").addEventListener("click", () => {
  const u = new URL(location.href);
  if (wantDemo()) u.searchParams.delete("demo"); else u.searchParams.set("demo", "1");
  history.replaceState(null, "", u);
  load();
});

/* Theme: follow the system until the reader overrides it, then remember (shared with the chat page). */
const THEME_KEY = "daleel_theme";
const themeBtn = document.getElementById("theme");
function storedTheme(){ try { return localStorage.getItem(THEME_KEY) || "auto"; } catch(e){ return "auto"; } }
function darkNow(){ const t = storedTheme(); return t === "auto" ? window.matchMedia("(prefers-color-scheme: dark)").matches : t === "dark"; }
function paintTheme(){
  const t = storedTheme();
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = darkNow() ? T.light : T.dark;
}
themeBtn.addEventListener("click", () => { try { localStorage.setItem(THEME_KEY, darkNow() ? "light" : "dark"); } catch(e){} paintTheme(); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (storedTheme() === "auto") paintTheme(); });
paintTheme();
load();
</script>
