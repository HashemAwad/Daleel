<!doctype html>
<!-- Daleel. Owner: C (tickets C0, C1, C5).
     Two independent axes, deliberately not conflated:
       * the INTERFACE language (ar/en) sets document lang + dir. Detected from
         the browser, overridable, remembered.
       * the MESSAGE language is detected per message by the backend and is
         never asked for. A reader can write Arabizi into an English interface
         and get an Arabizi answer back.
     Theme is the same pattern: follow the system, allow an override, remember.

     Design: an official record, not a messaging app. Answers are entries and
     the source is a reference line.

     No external assets — the venue network cannot be trusted, so the cedar is
     inline SVG and both typefaces are resident on-device. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#F7F8F3" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#151813" media="(prefers-color-scheme: dark)"/>
<title>دليل — وزارة الصحة العامة</title>
<style>
  /* Light is the base. Dark is declared twice on purpose: the media query
     follows the system, the data-theme scope follows an explicit choice and
     has to win in both directions. */
  :root{
    color-scheme: light;
    --cedar:#15693A;
    --cedar-deep:#0D4426;
    --seal:#C62127;        /* emergencies and the identity rule. Nowhere else. */
    /* A sheet of paper on a desk, not a white screen. The ground carries a
       faint green cast pulled from the cedar, which keeps it out of both the
       clinical-white and the warm-cream default. */
    --ink:#1E211C;
    --ink-2:#454941;
    --quiet:#686C62;
    --ground:#E9EBE3;      /* the desk */
    --paper:#F7F8F3;       /* the sheet the record sits on */
    --paper-2:#E8EAE1;     /* the reader's margin note */
    --rule:#D2D6C9;
    --rule-soft:#E1E4DA;
    --amber:#73510A; --amber-wash:#F2EBD6;
    --seal-wash:#F6E6E4;

    --font-latin:"Charter","Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
    --font-ar:"Noto Naskh Arabic","SF Arabic","Geeza Pro","Traditional Arabic",serif;

    --measure:40rem;
    --swift:cubic-bezier(.2,.65,.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --cedar:#5FB98A; --cedar-deep:#93D8B2; --seal:#FF8F8A;
      --ink:#ECEFE8; --ink-2:#C7CBC1; --quiet:#8D9288;
      --ground:#0C0E0B; --paper:#151813; --paper-2:#1E221B;
      --rule:#2C3128; --rule-soft:#212520;
      --amber:#E2BC72; --amber-wash:#2A2109; --seal-wash:#2E1512;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --cedar:#5FB98A; --cedar-deep:#93D8B2; --seal:#FF8F8A;
    --ink:#ECEFE8; --ink-2:#C7CBC1; --quiet:#8D9288;
    --ground:#0C0E0B; --paper:#151813; --paper-2:#1E221B;
    --rule:#2C3128; --rule-soft:#212520;
    --amber:#E2BC72; --amber-wash:#2A2109; --seal-wash:#2E1512;
  }

  *{box-sizing:border-box}
  html,body{height:100%; overflow-x:hidden}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--font-latin),var(--font-ar);
    font-size:17px; line-height:1.7;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  /* Naskh carries more above and below the line than the Latin serif does. */
  html[lang="ar"] body{font-family:var(--font-ar),var(--font-latin); line-height:1.85}
  .bidi{unicode-bidi:plaintext; text-align:start}
  bdi{unicode-bidi:isolate}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  /* Full bleed. Depth comes from banding the surfaces, not from boxing the
     page in: the record is the bright sheet, the chrome sits back on the
     ground tone above and below it. */
  #app{height:100%; display:flex; flex-direction:column; background:var(--paper)}
  .col{width:100%; max-width:var(--measure); margin-inline:auto; padding-inline:22px}

  /* ---- letterhead ------------------------------------------------------- */
  .letterhead{flex:none; background:var(--ground)}
  .lockup{display:flex; align-items:center; flex-wrap:wrap; gap:8px 13px;
          padding-block:13px;
          padding-top:calc(13px + env(safe-area-inset-top))}
  .cedar{width:31px; height:31px; flex:none; fill:var(--cedar); display:block}
  .titles{display:flex; flex-direction:column; line-height:1.2}
  /* Caps here are the ministry's actual logotype, not a decorative eyebrow. */
  .titles span{font-size:10px; font-weight:700; letter-spacing:.11em;
               text-transform:uppercase}
  html[lang="ar"] .titles span{letter-spacing:0; font-size:11px; text-transform:none}
  .t-state{color:var(--cedar)}
  .t-ministry{color:var(--seal)}
  .vrule{width:1px; align-self:stretch; background:var(--rule); margin-inline:5px}
  .svc{font-size:16px; font-weight:600}
  .grow{flex:1}
  .letterhead nav{display:flex; gap:19px; font-size:14px; white-space:nowrap}
  .letterhead nav a{
    color:var(--ink-2); text-decoration:none; padding-bottom:2px;
    border-bottom:1px solid transparent;
    transition:color .2s var(--swift), border-color .2s var(--swift);
  }
  .letterhead nav a:hover{color:var(--cedar); border-bottom-color:var(--cedar)}

  .controls{display:flex; gap:14px; align-items:center; margin-inline-start:16px}
  .controls button{
    font:inherit; font-size:13.5px; background:none; border:0; cursor:pointer;
    color:var(--quiet); padding:0 0 2px; border-bottom:1px solid var(--rule);
    transition:color .2s var(--swift), border-color .2s var(--swift);
  }
  .controls button:hover{color:var(--cedar); border-bottom-color:var(--cedar)}
  @media (max-width:620px){
    .titles,.vrule{display:none}
    .letterhead nav{gap:15px; font-size:13.5px}
    .controls{margin-inline-start:auto; gap:12px}
  }
  @media (max-width:430px){
    .svc{display:none}
    .letterhead nav{gap:13px}
    .controls{gap:11px}
  }

  /* The identity rule: cedar green, broken by the ministry's red. */
  .band{height:2px; background:var(--cedar); position:relative}
  .band::after{content:""; position:absolute; inset-block:0; inset-inline-start:0;
               width:84px; background:var(--seal)}

  /* ---- record ----------------------------------------------------------- */
  #scroll{flex:1; overflow-y:auto; overscroll-behavior:contain; background:var(--paper)}
  #log{display:flex; flex-direction:column; padding-block:30px 10px}

  .m{max-width:100%; white-space:pre-wrap; overflow-wrap:anywhere}
  .m + .m{margin-top:26px}
  /* The reader's question: a margin note, indented and ruled on the leading
     edge. Logical properties throughout, so it mirrors with the interface. */
  .m.u{
    color:var(--ink-2); font-size:16px;
    padding:4px 15px; margin-inline-start:auto; max-width:82%;
    border-inline-start:2px solid var(--rule);
    background:var(--paper-2);
  }
  /* An answer is marked in the margin, never boxed. A plain answer gets the
     cedar lozenge; a flagged one gets a rule down the whole entry, so the
     colour arrives before the first word is read. */
  .m.b{position:relative; padding-inline-start:20px}
  .m.b::before{
    content:""; position:absolute; inset-inline-start:0; top:.72em;
    width:7px; height:7px; background:var(--cedar);
    clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  .m.b.flagged::before{top:0; width:3px; height:100%; clip-path:none}
  .m.b.flagged.emergency::before{background:var(--seal)}
  .m.b.flagged.refused::before,
  .m.b.flagged.unanswered::before{background:var(--amber)}
  .m.sys{color:var(--quiet); font-size:15px; text-align:center;
         border-block:1px solid var(--rule-soft); padding-block:14px}
  .m.enter{animation:settle .34s var(--swift) both}
  @keyframes settle{from{opacity:0; transform:translateY(5px)}}

  .flag{display:block; font-size:14px; font-weight:700; margin-bottom:5px}
  .flag.emergency{color:var(--seal)}
  .flag.refused,.flag.unanswered{color:var(--amber)}

  /* The rule under an answer is its reference line, and the cedar is stamped
     over it — the mark appears only where a verified source backs the text,
     which is the one claim this service makes. */
  .srcs{position:relative; margin-top:20px; padding-top:16px;
        border-top:1px solid var(--rule);
        display:flex; flex-direction:column; gap:5px}
  .attest{
    position:absolute; top:-11px; inset-inline-start:0;
    background:var(--paper); padding-inline-end:10px; line-height:1;
    color:var(--cedar);
  }
  .attest svg{width:21px; height:21px; fill:currentColor; display:block}
  .src{font-size:14.5px; line-height:1.6; color:var(--quiet)}
  .src a{color:var(--cedar); text-decoration:none;
         border-bottom:1px solid var(--rule); transition:border-color .2s var(--swift)}
  .src a:hover{border-bottom-color:var(--cedar)}

  .typing{display:flex; align-items:center; height:28px; padding-inline-start:20px}
  .typing i{position:relative; display:block; width:58px; height:2px;
            background:var(--rule-soft); overflow:hidden}
  /* a logical inset, so the sweep runs the way the interface reads */
  .typing i::after{content:""; position:absolute; inset-block:0; width:42%;
                   background:var(--cedar); animation:sweep 1.15s var(--swift) infinite}
  @keyframes sweep{from{inset-inline-start:-42%} to{inset-inline-start:100%}}

  /* ---- opening: the seal ------------------------------------------------ */
  #open{padding-block:7vh 0}
  #open h1{
    font-size:clamp(33px, 7.4vw, 53px); font-weight:600; line-height:1.14;
    margin:0 0 16px; letter-spacing:-.023em; max-width:18ch;
    overflow-wrap:break-word;
  }
  html[lang="ar"] #open h1{line-height:1.34; letter-spacing:0}
  #open .lede{margin:0; color:var(--quiet); font-size:17px; line-height:1.6;
              max-width:42ch}

  /* The register: each opener names, in its own script, the language it is
     written in. The four-language promise is shown in the margin instead of
     being claimed in a sentence. */
  .register{margin-top:34px; border-top:1px solid var(--rule)}
  .ex{
    display:grid; grid-template-columns:5.4rem minmax(0,1fr); gap:3px 18px;
    align-items:baseline; width:100%; font:inherit; font-size:17.5px;
    cursor:pointer; background:none; border:0;
    border-bottom:1px solid var(--rule-soft);
    color:var(--ink-2); text-align:start; padding:15px 2px;
    transition:color .22s var(--swift), padding .28s var(--swift),
               background .22s var(--swift);
  }
  .ex .script{font-size:13px; font-weight:700; color:var(--cedar);
              white-space:nowrap; transition:color .22s var(--swift)}
  .ex .q{unicode-bidi:isolate}
  .ex > span{min-width:0; overflow-wrap:anywhere}
  .ex:hover{color:var(--ink); padding-inline-start:11px; background:var(--paper-2)}
  .ex:hover .script{color:var(--cedar-deep)}
  .ex:active{padding-inline-start:7px}
  @media (max-width:430px){
    .ex{grid-template-columns:minmax(0,1fr); font-size:16.5px}
  }

  /* ---- composer --------------------------------------------------------- */
  .composer{flex:none; background:var(--ground); border-top:1px solid var(--rule)}
  .well{display:flex; align-items:flex-end; gap:10px; padding-block:12px}
  #t{
    flex:1; border:0; outline:0; background:transparent; color:var(--ink);
    font:inherit; resize:none; padding:7px 0; max-height:170px; min-height:26px;
    line-height:1.7;
  }
  #t::placeholder{color:var(--quiet); opacity:.85}
  #send{
    width:44px; height:44px; flex:none; border:0; cursor:pointer;
    background:var(--cedar); color:var(--paper); display:grid; place-items:center;
    transition:background .22s var(--swift), opacity .22s var(--swift),
               transform .22s var(--swift);
  }
  #send:hover:not(:disabled){background:var(--cedar-deep)}
  #send:active:not(:disabled){transform:scale(.94)}
  #send:disabled{opacity:.28; cursor:default}
  /* The arrow points the way the interface reads. */
  #send svg{width:18px; height:18px; fill:currentColor; display:block}
  html[dir="rtl"] #send svg{transform:scaleX(-1)}
  .standing{
    font-size:13.5px; color:var(--quiet); line-height:1.6;
    padding-bottom:calc(11px + env(safe-area-inset-bottom));
  }
  .standing b{color:var(--seal); font-weight:700}
  .data-credit{font-size:11px; color:var(--quiet); margin-top:-6px}
  .data-credit a{color:inherit; text-decoration:none}

  .more{display:flex; gap:20px; padding-block:16px 0; font-size:14.5px}
  .more button{
    font:inherit; background:none; border:0; cursor:pointer; color:var(--ink-2);
    padding:0 0 2px; border-bottom:1px solid var(--rule);
    transition:color .2s var(--swift), border-color .2s var(--swift);
  }
  .more button:hover{color:var(--cedar); border-bottom-color:var(--cedar)}

  :is(button,a,textarea):focus-visible{outline:2px solid var(--cedar); outline-offset:3px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="cedar" viewBox="0 0 64 64">
  <path d="M32 3 L21.5 17h5.5L18.5 29h6L10 43h18.5v18h7V43H54L39.5 29h6L37 17h5.5Z"/>
</symbol></svg>

<div id="app">
  <div class="letterhead">
    <div class="col lockup">
      <svg class="cedar" aria-hidden="true"><use href="#cedar"/></svg>
      <div class="titles">
        <span class="t-state" id="tState">الجمهورية اللبنانية</span>
        <span class="t-ministry" id="tMinistry">وزارة الصحة العامة</span>
      </div>
      <div class="vrule" aria-hidden="true"></div>
      <span class="svc" id="svc">دليل</span>
      <div class="grow"></div>
      <nav>
        <a href="/join" id="navWa">واتساب</a>
        <a href="/dashboard" id="navStats">الإحصاءات</a>
      </nav>
      <div class="controls">
        <button type="button" id="langBtn" lang="en">English</button>
        <button type="button" id="themeBtn"></button>
      </div>
    </div>
    <div class="band" aria-hidden="true"></div>
  </div>

  <div id="scroll">
    <div class="col">
      <section id="open">
        <h1 id="openH"></h1>
        <p class="lede" id="openP"></p>
        <div class="register" id="examples"></div>
      </section>

      <div id="log" role="log" aria-live="polite"></div>
      <div class="more" id="more"></div>
    </div>
  </div>

  <div class="composer">
    <div class="col">
      <form id="f" autocomplete="off">
        <label class="sr" for="t" id="tLabel"></label>
        <div class="well">
          <textarea id="t" rows="1" dir="auto" class="bidi" enterkeyhint="send"></textarea>
          <button id="send" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5V14l9-2-9-2V3.5L21.5 12z"/></svg>
          </button>
        </div>
      </form>
      <p class="standing" id="standing"></p>
      <p class="data-credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">Facility map data: OpenStreetMap contributors</a></p>
    </div>
  </div>
</div>

<script>
"use strict";
const API     = (location.origin || "http://localhost:8000");
const log     = document.getElementById("log");
const scroller= document.getElementById("scroll");
const input   = document.getElementById("t");
const sendBtn = document.getElementById("send");
const root    = document.documentElement;

let hotlines = [];
let busy = false;
let started = false;

const CALM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function scrollDown(){
  scroller.scrollTo({ top: scroller.scrollHeight, behavior: CALM ? "auto" : "smooth" });
}

/* ================= interface language =====================================
   Chrome only. What the reader types is classified by the backend, so an
   English interface still answers an Arabic question in Arabic. */
const STRINGS = {
  ar: {
    dir:"rtl", title:"دليل — وزارة الصحة العامة",
    state:"الجمهورية اللبنانية", ministry:"وزارة الصحة العامة", svc:"دليل",
    navWa:"واتساب", navStats:"الإحصاءات",
    otherLang:"English",
    toDark:"داكن", toLight:"فاتح",
    openH:"اسأل عن أي معاملة أو دواء أو مستشفى",
    openP:"كل جواب يستند إلى مصدر رسمي. وإن لم يتوفّر مصدر، نحيلك إلى الخط الساخن بدل أن نخمّن.",
    tLabel:"اكتب سؤالك", placeholder:"اكتب سؤالك هنا", sendLabel:"إرسال",
    logLabel:"المحادثة",
    standing:["معلومات رسمية فقط. لا نقدّم نصائح طبية أو جرعات. للطوارئ اتصل بالرقم ", "."],
    srcPrefix:"المصدر: ", checked:"، روجع في ",
    another:"اسأل سؤالاً آخر", hotlinesBtn:"أرقام الطوارئ",
    hotlinesHead:"أرقام الطوارئ والخطوط الساخنة",
    offline:"الخدمة غير متاحة الآن. تحقق من اتصالك ثم أعد المحاولة.",
    retry:"أعد المحاولة",
    flags:{ emergency:"طوارئ", refused:"لا نصائح طبية", unanswered:"لا يوجد مصدر رسمي" },
    attest:"مصدر رسمي موثّق",
    fallbackLines:[
      { name:"الخط الساخن لوزارة الصحة", number:"1787", purpose:"معلومات صحية عامة" },
      { name:"الصليب الأحمر اللبناني",    number:"140",  purpose:"طوارئ وإسعاف" },
    ],
  },
  en: {
    dir:"ltr", title:"Daleel — Ministry of Public Health",
    state:"Republic of Lebanon", ministry:"Ministry of Public Health", svc:"Daleel",
    navWa:"WhatsApp", navStats:"Statistics",
    otherLang:"العربية",
    toDark:"Dark", toLight:"Light",
    openH:"Ask about a procedure, a medicine, or a hospital",
    openP:"Every answer comes from an official source. When there is none, you get the hotline instead of a guess.",
    tLabel:"Type your question", placeholder:"Type your question here", sendLabel:"Send",
    logLabel:"Conversation",
    standing:["Official information only. No medical or dosing advice. In an emergency call ", "."],
    srcPrefix:"Source: ", checked:", checked ",
    another:"Ask another question", hotlinesBtn:"Emergency numbers",
    hotlinesHead:"Emergency and hotline numbers",
    offline:"The service is unavailable. Check your connection, then try again.",
    retry:"Try again",
    flags:{ emergency:"Emergency", refused:"No medical advice", unanswered:"No official source" },
    attest:"Verified official source",
    fallbackLines:[
      { name:"Ministry of Public Health hotline", number:"1787", purpose:"general health information" },
      { name:"Lebanese Red Cross",                number:"140",  purpose:"emergency and ambulance" },
    ],
  },
};

const UI_KEY = "daleel_ui_lang";
let ui = "ar";
let T = STRINGS.ar;

function detectUi(){
  try {
    const saved = localStorage.getItem(UI_KEY);
    if (saved && STRINGS[saved]) return saved;
  } catch(e){}
  const tags = navigator.languages || [navigator.language || "ar"];
  return tags.some(t => String(t).toLowerCase().startsWith("ar")) ? "ar" : "en";
}

function applyUi(code){
  ui = STRINGS[code] ? code : "ar";
  T = STRINGS[ui];
  try { localStorage.setItem(UI_KEY, ui); } catch(e){}

  root.lang = ui;
  root.dir  = T.dir;
  document.title = T.title;

  const set = (id, text) => { document.getElementById(id).textContent = text; };
  set("tState", T.state); set("tMinistry", T.ministry); set("svc", T.svc);
  set("navWa", T.navWa);  set("navStats", T.navStats);
  set("openH", T.openH);  set("openP", T.openP);
  set("tLabel", T.tLabel);
  input.placeholder = T.placeholder;
  sendBtn.setAttribute("aria-label", T.sendLabel);
  log.setAttribute("aria-label", T.logLabel);
  document.getElementById("langBtn").textContent = T.otherLang;
  document.getElementById("langBtn").lang = ui === "ar" ? "en" : "ar";
  paintTheme();

  // the emergency number stays LTR inside either script
  const st = document.getElementById("standing");
  st.textContent = "";
  st.appendChild(document.createTextNode(T.standing[0]));
  const b = document.createElement("b");
  const num = document.createElement("bdi"); num.dir = "ltr"; num.textContent = "140";
  b.appendChild(num); st.appendChild(b);
  st.appendChild(document.createTextNode(T.standing[1]));

  openers();
  if (document.getElementById("more").children.length) followUps();
}

/* ================= theme ================================================= */
const THEME_KEY = "daleel_theme";
function currentTheme(){
  try { return localStorage.getItem(THEME_KEY) || "auto"; } catch(e){ return "auto"; }
}
function systemDark(){ return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function isDark(){
  const t = currentTheme();
  return t === "auto" ? systemDark() : t === "dark";
}
function paintTheme(){
  const t = currentTheme();
  if (t === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", t);
  const btn = document.getElementById("themeBtn");
  // the control names what pressing it does, not what is currently on
  btn.textContent = isDark() ? T.toLight : T.toDark;
}
function toggleTheme(){
  const next = isDark() ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  paintTheme();
}
// follow the system until the reader overrides it
window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", () => { if (currentTheme() === "auto") paintTheme(); });

/* ---------- identity: an opaque session ref, never anything personal ------ */
const REF_KEY = "daleel_user_ref";
async function userRef(){
  let ref = null;
  try { ref = localStorage.getItem(REF_KEY); } catch(e){}
  if (ref) return ref;
  try {
    const r = await fetch(API + "/api/session");
    ref = (await r.json()).user_ref;
  } catch(e){
    ref = "web_local_" + Math.random().toString(36).slice(2,12);
  }
  try { localStorage.setItem(REF_KEY, ref); } catch(e){}
  return ref;
}

/* ---------- entries ------------------------------------------------------- */
function entry(who){
  const d = document.createElement("div");
  d.className = "m " + who + " bidi" + (CALM ? "" : " enter");
  d.setAttribute("dir","auto");          // per-message direction, not the UI's
  log.appendChild(d);
  scrollDown();
  return d;
}

/* Render text, turning any http(s) URL into a clickable link. Builds DOM nodes
   (never innerHTML) so it stays injection-safe. */
function linkify(el, text){
  el.textContent = "";
  const re = /(https?:\/\/[^\s]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    const url = m[0].replace(/[.,،]+$/, "");
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = url.includes("google.com/maps") ? "Open in Google Maps" : url;
    el.appendChild(a);
    last = m.index + m[0].length;
  }
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}

function say(text, who){
  const d = entry(who);
  d.textContent = text;                   // textContent: never inject markup
  scrollDown();
  return d;
}

function showAnswer(a){
  const d = entry("b");

  if (T.flags[a.outcome]){
    // the class paints the margin rule; the word says the same thing in text,
    // so the outcome never rests on colour alone
    d.classList.add("flagged", a.outcome);
    const f = document.createElement("span");
    f.className = "flag " + a.outcome;
    f.textContent = T.flags[a.outcome];
    d.appendChild(f);
  }

  const body = document.createElement("span");
  body.setAttribute("dir","auto");
  body.className = "bidi";
  linkify(body, a.text || "");          // URLs (e.g. Google Maps) become clickable
  d.appendChild(body);

  const srcs = (a.sources || []).filter(s => s && s.url);
  if (srcs.length){
    const wrap = document.createElement("div");
    wrap.className = "srcs";

    if (srcs.length){
      const seal = document.createElement("span");
      seal.className = "attest";
      seal.textContent = T.attest;
      wrap.appendChild(seal);
    }

    const seen = new Set();
    for (const s of srcs){
      if (seen.has(s.url)) continue;
      seen.add(s.url);
      const row = document.createElement("div");
      row.className = "src bidi";
      row.setAttribute("dir","auto");
      row.appendChild(document.createTextNode(T.srcPrefix));

      const link = document.createElement("a");
      link.href = s.url;                  // href only; text is set separately
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = s.title || s.url;
      row.appendChild(link);

      if (s.checked_on){
        row.appendChild(document.createTextNode(T.checked));
        const d2 = document.createElement("bdi");
        d2.dir = "ltr"; d2.textContent = s.checked_on;
        row.appendChild(d2);
      }
      wrap.appendChild(row);
    }

    d.appendChild(wrap);
  }

  scrollDown();
}

function typing(on){
  let el = document.getElementById("typing");
  if (on && !el){
    el = document.createElement("div");
    el.id = "typing";
    el.className = "m b typing";
    el.innerHTML = "<i></i>";
    log.appendChild(el);
    scrollDown();
  } else if (!on && el){
    el.remove();
  }
}

/* ---------- openers -------------------------------------------------------
   The same four languages whichever interface is showing: the point is that
   mixing is expected, and that does not change when the chrome flips. */
const EXAMPLES = [
  { script:"العربية",  lang:"ar",      text:"كيف أجدّد دفتر الدواء المزمن؟" },
  { script:"Arabizi",  lang:"ar-Latn", text:"kif 2a2dar la2i mosta2fa 7koume 2arib?" },
  { script:"Français", lang:"fr",      text:"Combien coûte le Concor 5 ?" },
  { script:"English",  lang:"en",      text:"Nearest pharmacy in Aley" },
];

function openers(){
  const bar = document.getElementById("examples");
  if (!bar) return;
  bar.textContent = "";
  for (const ex of EXAMPLES){
    const b = document.createElement("button");
    b.type = "button"; b.className = "ex";
    const tag = document.createElement("span");
    tag.className = "script"; tag.lang = ex.lang;
    tag.textContent = ex.script;
    // isolated, not plaintext: the Arabic row still starts in the column the
    // other three start in, while the Arabic itself reads right to left
    const q = document.createElement("span");
    q.className = "q";
    q.textContent = ex.text;
    b.appendChild(tag); b.appendChild(q);
    b.addEventListener("click", () => send(ex.text));
    bar.appendChild(b);
  }
}

function followUps(){
  const bar = document.getElementById("more");
  bar.textContent = "";
  const items = [[T.another, () => { bar.textContent = ""; input.focus(); }],
                 [T.hotlinesBtn, showHotlines]];
  for (const [label, fn] of items){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.addEventListener("click", fn);
    bar.appendChild(b);
  }
}

function showHotlines(){
  const d = entry("b");
  const head = document.createElement("div");
  head.className = "bidi"; head.setAttribute("dir","auto");
  head.textContent = T.hotlinesHead;
  d.appendChild(head);

  const list = document.createElement("div");
  list.className = "srcs";
  const rows = hotlines.length ? hotlines : T.fallbackLines;
  for (const h of rows){
    const row = document.createElement("div");
    row.className = "src bidi"; row.setAttribute("dir","auto");
    const a = document.createElement("a");
    a.href = "tel:" + h.number;
    const num = document.createElement("bdi");   // numbers stay LTR in either script
    num.dir = "ltr"; num.textContent = h.number;
    a.appendChild(num);
    row.appendChild(a);
    row.appendChild(document.createTextNode(" — " + h.name + "، " + h.purpose));
    list.appendChild(row);
  }
  d.appendChild(list);
  scrollDown();
}

/* ---------- composer ------------------------------------------------------ */
function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 170) + "px";
}
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

/* ---------- location (enables TRUE "nearest" by distance) ----------------- */
let coords = null;
function requestLocation(){
  if (!navigator.geolocation) return;          // needs https or localhost
  navigator.geolocation.getCurrentPosition(
    (p) => { coords = { lat: p.coords.latitude, lon: p.coords.longitude }; },
    () => { coords = null; },                  // denied -> backend falls back to town
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 600000 }
  );
}

/* ---------- sending ------------------------------------------------------- */
async function send(text){
  if (busy) return;
  const q = (text || input.value).trim();
  if (!q) return;

  if (!started){
    started = true;
    const op = document.getElementById("open");
    if (op) op.remove();
  }
  document.getElementById("more").textContent = "";

  say(q, "u");
  input.value = ""; autoGrow();
  busy = true; sendBtn.disabled = true;
  typing(true);

  try {
    const r = await fetch(API + "/chat", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      // lang is omitted on purpose: the backend detects it per message.
      body: JSON.stringify({
        channel:"web", text:q, user_ref: await userRef(),
        ...(coords ? { lat: coords.lat, lon: coords.lon } : {}),   // true nearest when shared
      }),
    });
    typing(false);
    if (!r.ok) throw new Error("HTTP " + r.status);
    showAnswer(await r.json());
    followUps();
  } catch (err){
    typing(false);
    const d = say(T.offline, "sys");
    const retry = document.createElement("button");
    retry.type = "button"; retry.textContent = T.retry;
    retry.style.cssText = "font:inherit;background:none;border:0;cursor:pointer;"
      + "color:var(--cedar);border-bottom:1px solid var(--rule);margin-top:8px;padding:0 0 2px";
    retry.addEventListener("click", () => { retry.remove(); send(q); });
    d.appendChild(document.createElement("br"));
    d.appendChild(retry);
  } finally {
    busy = false; sendBtn.disabled = false;
    input.focus();
  }
}

document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); send(); });
document.getElementById("langBtn").addEventListener("click", () => {
  applyUi(ui === "ar" ? "en" : "ar"); input.focus();
});
document.getElementById("themeBtn").addEventListener("click", toggleTheme);

/* ---------- boot ---------------------------------------------------------- */
(async function boot(){
  const params = new URLSearchParams(location.search);
  applyUi(params.get("lang") || detectUi());
  input.focus();
  requestLocation();   // ask once; if allowed, "nearest" uses real distance, else town

  try {
    const h = await fetch(API + "/api/hotlines");
    if (h.ok) hotlines = (await h.json()).hotlines || [];
  } catch(e){}

  // Deep link: /?q=... asks a question straight away, so a QR, an SMS or a
  // link from a MoPH page can drop someone into a specific answer.
  const q = params.get("q");
  if (q) send(q);
})();
</script>
