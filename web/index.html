<!doctype html>
<!-- Daleel. Owner: C (tickets C0, C1, C5).
     Two independent axes, deliberately not conflated:
       * the INTERFACE language (ar/en) sets document lang + dir. Detected from
         the browser, overridable, remembered.
       * the MESSAGE language is detected per message by the backend and is
         never asked for. A reader can write Arabizi into an English interface
         and get an Arabizi answer back.
     Theme is the same pattern: follow the system, allow an override, remember.

     Design: the same olive-and-beige look as the dashboard. Hanken Grotesk for text, Archivo for
     headings (Google Fonts; Noto Sans Arabic supplies the Arabic letters). Offline, system fonts take over;
     the cedar is inline SVG, so nothing else is fetched. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#F4EFE4" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#1D2018" media="(prefers-color-scheme: dark)"/>
<title>دليل — وزارة الصحة العامة</title>
<link rel="icon" href="data:,"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"/>
<style>
  /* Olive on beige. Every text colour is >= 4.5:1 on its background (checked in both modes).
     Dark is declared twice on purpose: the media query follows the system, the data-theme scope
     follows an explicit choice and has to win in both directions. */
  :root{
    color-scheme: light;
    --bg:#F4EFE4; --card:#FCFAF4; --line:#E3DCCB; --track:#E6E8D3;
    --ink:#272B1C; --ink-2:#4A4F3A; --quiet:#5E634D;
    --olive:#4F5E1F; --olive-deep:#3C4817; --on-olive:#FCFAF4;
    --bad:#A23B1C; --bad-wash:#F7E4DC; --attn:#9A4A1E; --attn-wash:#F5E8D8;
    --focus:#0B4FB3;
    --measure:46rem;
    --swift:cubic-bezier(.2,.65,.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#1D2018; --card:#282C20; --line:#3A4030; --track:#343A29;
      --ink:#E4E1D3; --ink-2:#C3C5B1; --quiet:#A3A790;
      --olive:#A9B872; --olive-deep:#C3D08C; --on-olive:#1D2018;
      --bad:#E8927C; --bad-wash:#3A2219; --attn:#DDA06B; --attn-wash:#342818;
      --focus:#9DBEF0;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#1D2018; --card:#282C20; --line:#3A4030; --track:#343A29;
    --ink:#E4E1D3; --ink-2:#C3C5B1; --quiet:#A3A790;
    --olive:#A9B872; --olive-deep:#C3D08C; --on-olive:#1D2018;
    --bad:#E8927C; --bad-wash:#3A2219; --attn:#DDA06B; --attn-wash:#342818;
    --focus:#9DBEF0;
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hanken Grotesk","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;
    font-size:18px; line-height:1.65; font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{line-height:1.9}
  h1,h2{font-family:Archivo,"Noto Sans Arabic","Hanken Grotesk",system-ui,sans-serif}
  .bidi{unicode-bidi:plaintext; text-align:start}
  bdi{unicode-bidi:isolate}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  #app{height:100%; display:flex; flex-direction:column; background:var(--bg)}
  .col{width:100%; max-width:var(--measure); margin-inline:auto; padding-inline:24px}

  /* ---- header ----------------------------------------------------------- */
  .letterhead{flex:none; border-bottom:1px solid var(--line); background:var(--bg)}
  .lockup{display:flex; align-items:center; gap:14px; padding-block:12px;
          padding-top:calc(12px + env(safe-area-inset-top))}
  .cedar{width:30px; height:30px; flex:none; fill:var(--olive); display:block}
  .titles{display:flex; flex-direction:column; line-height:1.25; color:var(--ink-2)}
  .titles span{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
  html[lang="ar"] .titles span{letter-spacing:0; font-size:13px; text-transform:none}
  .svc{font-size:20px; font-weight:700; margin:0}
  .grow{flex:1}
  .letterhead nav{display:flex; gap:6px; font-size:16px}
  .letterhead nav a{
    display:inline-flex; align-items:center; min-height:44px; padding:0 14px; border-radius:999px;
    color:var(--ink-2); text-decoration:none; font-weight:500;
    transition:color .2s var(--swift), background .2s var(--swift);
  }
  .letterhead nav a:hover{color:var(--olive); background:var(--card)}
  .controls{display:flex; gap:8px; align-items:center}
  .controls button{
    font:inherit; font-size:15px; font-weight:600; min-height:44px; min-width:44px; padding:6px 18px; cursor:pointer;
    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:999px;
    transition:color .2s var(--swift), border-color .2s var(--swift);
  }
  .controls button:hover{color:var(--olive); border-color:var(--olive)}
  @media (max-width:640px){
    .lockup{flex-wrap:wrap; row-gap:0}
    .letterhead nav{order:3; width:100%}
    .controls{margin-inline-start:auto}
    .titles{display:none}
  }

  /* ---- scroll area ------------------------------------------------------ */
  #scroll{flex:1; overflow-y:auto; overscroll-behavior:contain}
  #log{display:flex; flex-direction:column; padding-block:40px 12px}

  /* ---- home: the opening block ------------------------------------------ */
  #open{padding-block:72px 24px}
  #open h2{
    font-size:clamp(32px, 6vw, 52px); font-weight:800; line-height:1.15;
    margin:0 0 20px; letter-spacing:-.02em; max-width:20ch;
  }
  html[lang="ar"] #open h2{letter-spacing:0; line-height:1.35}
  #open .lede{margin:0; color:var(--quiet); font-size:19px; max-width:42ch}
  .examples{margin-top:48px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px}
  .ex{
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:6px;
    width:100%; min-height:104px; font:inherit; font-size:18px; font-weight:500;
    cursor:pointer; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:22px;
    text-align:start; padding:22px 26px;
    transition:border-color .2s var(--swift), color .2s var(--swift);
  }
  .ex:hover{border-color:var(--olive); color:var(--olive)}
  .ex .script{font-size:14px; font-weight:700; color:var(--olive)}
  .ex .q{unicode-bidi:isolate; overflow-wrap:anywhere; min-width:0}
  @media (min-width:1500px){ :root{--measure:52rem} }
  @media (max-width:640px){ .examples{grid-template-columns:minmax(0,1fr); gap:16px} #open{padding-block:44px 16px} .ex{min-height:84px} }

  /* ---- conversation ----------------------------------------------------- */
  .m{max-width:100%; white-space:pre-wrap; overflow-wrap:anywhere}
  .m + .m{margin-top:28px}
  .m.u{
    align-self:flex-end; max-width:82%; padding:14px 22px;
    background:var(--olive); color:var(--on-olive); font-size:18px;
    border-radius:24px;
  }
  .m.b{
    max-width:94%; padding:24px 28px; background:var(--card); border:1px solid var(--line);
    border-radius:24px;
  }
  /* the small "tail" corner follows the page direction too (each message sets its own dir=auto) */
  html[dir="ltr"] .m.u{border-bottom-right-radius:6px}
  html[dir="rtl"] .m.u{border-bottom-left-radius:6px}
  html[dir="ltr"] .m.b{border-bottom-left-radius:6px}
  html[dir="rtl"] .m.b{border-bottom-right-radius:6px}
  .m.sys{color:var(--quiet); font-size:16px; text-align:center; padding-block:12px}
  .m.enter{animation:settle .34s var(--swift) both}
  @keyframes settle{from{opacity:0; transform:translateY(6px)}}

  .flag{
    display:inline-block; font-size:14px; font-weight:600; line-height:1.4;
    padding:3px 14px; margin-bottom:12px; border-radius:999px;
  }
  .flag.emergency{background:var(--bad-wash); color:var(--bad)}
  .flag.refused,.flag.unanswered{background:var(--attn-wash); color:var(--attn)}

  .srcs{margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
        display:flex; flex-direction:column; gap:8px}
  .src{font-size:15.5px; line-height:1.6; color:var(--quiet)}
  .src a{color:var(--olive); font-weight:600; text-underline-offset:3px}
  .m a{color:var(--olive); text-underline-offset:3px}

  .typing{display:flex; gap:7px; align-items:center; height:56px; padding-block:0; width:fit-content}
  .typing i{width:8px; height:8px; border-radius:50%; background:var(--quiet);
            opacity:.35; animation:bob 1.3s var(--swift) infinite}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes bob{30%{opacity:.9; transform:translateY(-4px)}}

  .more{display:flex; gap:12px; flex-wrap:wrap; padding-block:24px 8px}
  .more button{
    font:inherit; font-size:16px; font-weight:600; min-height:44px; padding:8px 22px; cursor:pointer;
    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:999px;
    transition:color .2s var(--swift), border-color .2s var(--swift);
  }
  .more button:hover{color:var(--olive); border-color:var(--olive)}

  /* ---- composer: one rounded field with the send button inside ---------- */
  .composer{flex:none; background:var(--bg)}
  .composer .col{padding-block:16px 0}
  .well{
    display:flex; align-items:flex-end; gap:12px; background:var(--card);
    border:1px solid var(--line); border-radius:32px; padding:8px; padding-inline-start:26px;
  }
  .well:focus-within{border-color:var(--olive); outline:2px solid var(--olive); outline-offset:2px}
  #t{
    flex:1; border:0; outline:0; background:transparent; color:var(--ink);
    font:inherit; resize:none; padding:12px 0; max-height:170px; min-height:48px; line-height:1.6;
  }
  #t::placeholder{color:var(--quiet)}
  #send{
    width:48px; height:48px; flex:none; border:0; border-radius:50%; cursor:pointer;
    background:var(--olive); color:var(--on-olive); display:grid; place-items:center;
    transition:background .2s var(--swift), opacity .2s var(--swift), transform .2s var(--swift);
  }
  #send:hover:not(:disabled){background:var(--olive-deep)}
  #send:active:not(:disabled){transform:scale(.94)}
  #send:disabled{opacity:.4; cursor:default}
  #send svg{width:20px; height:20px; fill:currentColor; display:block}
  html[dir="rtl"] #send svg{transform:scaleX(-1)}
  .standing{
    font-size:15px; color:var(--quiet); line-height:1.6; margin:14px 0 0; text-align:center;
    padding-bottom:6px;
  }
  .standing b{color:var(--bad); font-weight:700}
  /* ODbL attribution for the facility data: always visible, quiet, and still a real link */
  .data-credit{font-size:13px; color:var(--quiet); text-align:center; margin:0;
               padding-bottom:env(safe-area-inset-bottom)}
  .data-credit a{color:inherit; text-underline-offset:3px; display:inline-flex; align-items:center; min-height:44px; padding-inline:10px}

  :is(button,a,textarea):focus-visible{outline:3px solid var(--focus); outline-offset:3px}
  #t:focus-visible{outline:0}
  @media (max-width:520px){ .col{padding-inline:16px} .m.b{padding:20px 20px} .m.u{max-width:90%} }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="cedar" viewBox="0 0 64 64">
  <path d="M32 3 L21.5 17h5.5L18.5 29h6L10 43h18.5v18h7V43H54L39.5 29h6L37 17h5.5Z"/>
</symbol></svg>

<div id="app">
  <header class="letterhead">
    <div class="col lockup">
      <svg class="cedar" aria-hidden="true"><use href="#cedar"/></svg>
      <div class="titles">
        <span class="t-state" id="tState">الجمهورية اللبنانية</span>
        <span class="t-ministry" id="tMinistry">وزارة الصحة العامة</span>
      </div>
      <div class="vrule" aria-hidden="true"></div>
      <h1 class="svc" id="svc">دليل</h1>
      <div class="grow"></div>
      <nav>
        <a href="/join" id="navWa">واتساب</a>
        <a href="/dashboard" id="navStats">الإحصاءات</a>
      </nav>
      <div class="controls">
        <button type="button" id="langBtn" lang="en">English</button>
        <button type="button" id="themeBtn"></button>
      </div>
    </div>
  </header>

  <main id="scroll">
    <div class="col">
      <section id="open">
        <h2 id="openH"></h2>
        <p class="lede" id="openP"></p>
        <div class="examples" id="examples"></div>
      </section>

      <div id="log" role="log" aria-live="polite"></div>
      <div class="more" id="more"></div>
    </div>
  </main>

  <footer class="composer">
    <div class="col">
      <form id="f" autocomplete="off">
        <label class="sr" for="t" id="tLabel"></label>
        <div class="well">
          <textarea id="t" rows="1" dir="auto" class="bidi" enterkeyhint="send"></textarea>
          <button id="send" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5V14l9-2-9-2V3.5L21.5 12z"/></svg>
          </button>
        </div>
      </form>
      <p class="standing" id="standing"></p>
      <p class="data-credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">Facility map data: OpenStreetMap contributors</a></p>
    </div>
  </footer>
</div>

<script>
"use strict";
const API     = (location.origin || "http://localhost:8000");
const log     = document.getElementById("log");
const scroller= document.getElementById("scroll");
const input   = document.getElementById("t");
const sendBtn = document.getElementById("send");
const root    = document.documentElement;

let hotlines = [];
let busy = false;
let started = false;

const CALM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function scrollDown(){
  scroller.scrollTo({ top: scroller.scrollHeight, behavior: CALM ? "auto" : "smooth" });
}

/* ================= interface language =====================================
   Chrome only. What the reader types is classified by the backend, so an
   English interface still answers an Arabic question in Arabic. */
const STRINGS = {
  ar: {
    dir:"rtl", title:"دليل — وزارة الصحة العامة",
    state:"الجمهورية اللبنانية", ministry:"وزارة الصحة العامة", svc:"دليل",
    navWa:"واتساب", navStats:"الإحصاءات",
    otherLang:"English",
    toDark:"داكن", toLight:"فاتح",
    openH:"اسأل عن أي معاملة أو دواء أو مستشفى",
    openP:"كل جواب يستند إلى مصدر رسمي. وإن لم يتوفّر مصدر، نحيلك إلى الخط الساخن بدل أن نخمّن.",
    tLabel:"اكتب سؤالك", placeholder:"اكتب سؤالك هنا", sendLabel:"إرسال",
    logLabel:"المحادثة",
    standing:["معلومات رسمية فقط. لا نقدّم نصائح طبية أو جرعات. للطوارئ اتصل بالرقم ", "."],
    srcPrefix:"المصدر: ", checked:"، روجع في ",
    another:"اسأل سؤالاً آخر", hotlinesBtn:"أرقام الطوارئ",
    hotlinesHead:"أرقام الطوارئ والخطوط الساخنة",
    offline:"الخدمة غير متاحة الآن. تحقق من اتصالك ثم أعد المحاولة.",
    retry:"أعد المحاولة",
    flags:{ emergency:"طوارئ", refused:"لا نصائح طبية", unanswered:"لا يوجد مصدر رسمي" },
    fallbackLines:[
      { name:"الخط الساخن لوزارة الصحة", number:"1787", purpose:"معلومات صحية عامة" },
      { name:"الصليب الأحمر اللبناني",    number:"140",  purpose:"طوارئ وإسعاف" },
    ],
  },
  en: {
    dir:"ltr", title:"Daleel — Ministry of Public Health",
    state:"Republic of Lebanon", ministry:"Ministry of Public Health", svc:"Daleel",
    navWa:"WhatsApp", navStats:"Statistics",
    otherLang:"العربية",
    toDark:"Dark", toLight:"Light",
    openH:"Ask about a procedure, a medicine, or a hospital",
    openP:"Every answer comes from an official source. When there is none, you get the hotline instead of a guess.",
    tLabel:"Type your question", placeholder:"Type your question here", sendLabel:"Send",
    logLabel:"Conversation",
    standing:["Official information only. No medical or dosing advice. In an emergency call ", "."],
    srcPrefix:"Source: ", checked:", checked ",
    another:"Ask another question", hotlinesBtn:"Emergency numbers",
    hotlinesHead:"Emergency and hotline numbers",
    offline:"The service is unavailable. Check your connection, then try again.",
    retry:"Try again",
    flags:{ emergency:"Emergency", refused:"No medical advice", unanswered:"No official source" },
    fallbackLines:[
      { name:"Ministry of Public Health hotline", number:"1787", purpose:"general health information" },
      { name:"Lebanese Red Cross",                number:"140",  purpose:"emergency and ambulance" },
    ],
  },
};

const UI_KEY = "daleel_ui_lang";
let ui = "ar";
let T = STRINGS.ar;

function detectUi(){
  try {
    const saved = localStorage.getItem(UI_KEY);
    if (saved && STRINGS[saved]) return saved;
  } catch(e){}
  const tags = navigator.languages || [navigator.language || "ar"];
  return tags.some(t => String(t).toLowerCase().startsWith("ar")) ? "ar" : "en";
}

function applyUi(code){
  ui = STRINGS[code] ? code : "ar";
  T = STRINGS[ui];
  try { localStorage.setItem(UI_KEY, ui); } catch(e){}

  root.lang = ui;
  root.dir  = T.dir;
  document.title = T.title;

  const set = (id, text) => { document.getElementById(id).textContent = text; };
  set("tState", T.state); set("tMinistry", T.ministry); set("svc", T.svc);
  set("navWa", T.navWa);  set("navStats", T.navStats);
  set("openH", T.openH);  set("openP", T.openP);
  set("tLabel", T.tLabel);
  input.placeholder = T.placeholder;
  sendBtn.setAttribute("aria-label", T.sendLabel);
  log.setAttribute("aria-label", T.logLabel);
  document.getElementById("langBtn").textContent = T.otherLang;
  document.getElementById("langBtn").lang = ui === "ar" ? "en" : "ar";
  paintTheme();

  // the emergency number stays LTR inside either script
  const st = document.getElementById("standing");
  st.textContent = "";
  st.appendChild(document.createTextNode(T.standing[0]));
  const b = document.createElement("b");
  const num = document.createElement("bdi"); num.dir = "ltr"; num.textContent = "140";
  b.appendChild(num); st.appendChild(b);
  st.appendChild(document.createTextNode(T.standing[1]));

  openers();
  if (document.getElementById("more").children.length) followUps();
}

/* ================= theme ================================================= */
const THEME_KEY = "daleel_theme";
function currentTheme(){
  try { return localStorage.getItem(THEME_KEY) || "auto"; } catch(e){ return "auto"; }
}
function systemDark(){ return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function isDark(){
  const t = currentTheme();
  return t === "auto" ? systemDark() : t === "dark";
}
function paintTheme(){
  const t = currentTheme();
  if (t === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", t);
  const btn = document.getElementById("themeBtn");
  // the control names what pressing it does, not what is currently on
  btn.textContent = isDark() ? T.toLight : T.toDark;
}
function toggleTheme(){
  const next = isDark() ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  paintTheme();
}
// follow the system until the reader overrides it
window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", () => { if (currentTheme() === "auto") paintTheme(); });

/* ---------- identity: an opaque session ref, never anything personal ------ */
const REF_KEY = "daleel_user_ref";
async function userRef(){
  let ref = null;
  try { ref = localStorage.getItem(REF_KEY); } catch(e){}
  if (ref) return ref;
  try {
    const r = await fetch(API + "/api/session");
    ref = (await r.json()).user_ref;
  } catch(e){
    ref = "web_local_" + Math.random().toString(36).slice(2,12);
  }
  try { localStorage.setItem(REF_KEY, ref); } catch(e){}
  return ref;
}

/* ---------- entries ------------------------------------------------------- */
function entry(who){
  const d = document.createElement("div");
  d.className = "m " + who + " bidi" + (CALM ? "" : " enter");
  d.setAttribute("dir","auto");          // per-message direction, not the UI's
  log.appendChild(d);
  scrollDown();
  return d;
}

/* Render text, turning any http(s) URL into a clickable link. Builds DOM nodes
   (never innerHTML) so it stays injection-safe. */
function linkify(el, text){
  el.textContent = "";
  const re = /(https?:\/\/[^\s]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    const url = m[0].replace(/[.,،]+$/, "");
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = url.includes("google.com/maps") ? "Open in Google Maps" : url;
    el.appendChild(a);
    last = m.index + m[0].length;
  }
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}

function say(text, who){
  const d = entry(who);
  d.textContent = text;                   // textContent: never inject markup
  scrollDown();
  return d;
}

function showAnswer(a){
  const d = entry("b");

  if (T.flags[a.outcome]){
    const f = document.createElement("span");
    f.className = "flag " + a.outcome;
    f.textContent = T.flags[a.outcome];
    d.appendChild(f);
    d.appendChild(document.createElement("br"));
  }

  const body = document.createElement("span");
  body.setAttribute("dir","auto");
  body.className = "bidi";
  linkify(body, a.text || "");          // URLs (e.g. Google Maps) become clickable
  d.appendChild(body);

  const srcs = (a.sources || []).filter(s => s && s.url);
  if (srcs.length){
    const wrap = document.createElement("div");
    wrap.className = "srcs";
    const seen = new Set();
    for (const s of srcs){
      if (seen.has(s.url)) continue;
      seen.add(s.url);
      const row = document.createElement("div");
      row.className = "src bidi";
      row.setAttribute("dir","auto");
      row.appendChild(document.createTextNode(T.srcPrefix));

      const link = document.createElement("a");
      link.href = s.url;                  // href only; text is set separately
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = s.title || s.url;
      row.appendChild(link);

      if (s.checked_on){
        row.appendChild(document.createTextNode(T.checked));
        const d2 = document.createElement("bdi");
        d2.dir = "ltr"; d2.textContent = s.checked_on;
        row.appendChild(d2);
      }
      wrap.appendChild(row);
    }

    d.appendChild(wrap);
  }

  scrollDown();
}

function typing(on){
  let el = document.getElementById("typing");
  if (on && !el){
    el = document.createElement("div");
    el.id = "typing";
    el.className = "m b typing";
    el.innerHTML = "<i></i><i></i><i></i>";
    log.appendChild(el);
    scrollDown();
  } else if (!on && el){
    el.remove();
  }
}

/* ---------- openers -------------------------------------------------------
   The same four languages whichever interface is showing: the point is that
   mixing is expected, and that does not change when the chrome flips. */
const EXAMPLES = [
  { script:"العربية",  lang:"ar",      text:"كيف أجدّد دفتر الدواء المزمن؟" },
  { script:"Arabizi",  lang:"ar-Latn", text:"kif 2a2dar la2i mosta2fa 7koume 2arib?" },
  { script:"Français", lang:"fr",      text:"Combien coûte le Concor 5 ?" },
  { script:"English",  lang:"en",      text:"Nearest pharmacy in Aley" },
];

function openers(){
  const bar = document.getElementById("examples");
  if (!bar) return;
  bar.textContent = "";
  for (const ex of EXAMPLES){
    const b = document.createElement("button");
    b.type = "button"; b.className = "ex";
    const tag = document.createElement("span");
    tag.className = "script"; tag.lang = ex.lang;
    tag.textContent = ex.script;
    // isolated, not plaintext: the Arabic row starts in the same column as the others
    const q = document.createElement("span");
    q.className = "q";
    q.dir = "auto";                 // each question orders its own punctuation ("?" stays at the end of Latin text)
    q.textContent = ex.text;
    b.appendChild(tag); b.appendChild(q);
    b.addEventListener("click", () => send(ex.text));
    bar.appendChild(b);
  }
}

function followUps(){
  const bar = document.getElementById("more");
  bar.textContent = "";
  const items = [[T.another, () => { bar.textContent = ""; input.focus(); }],
                 [T.hotlinesBtn, showHotlines]];
  for (const [label, fn] of items){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.addEventListener("click", fn);
    bar.appendChild(b);
  }
  scrollDown();
}

function showHotlines(){
  const d = entry("b");
  const head = document.createElement("div");
  head.className = "bidi"; head.setAttribute("dir","auto");
  head.textContent = T.hotlinesHead;
  d.appendChild(head);

  const list = document.createElement("div");
  list.className = "srcs";
  const rows = hotlines.length ? hotlines : T.fallbackLines;
  for (const h of rows){
    const row = document.createElement("div");
    row.className = "src bidi"; row.setAttribute("dir","auto");
    const a = document.createElement("a");
    a.href = "tel:" + h.number;
    const num = document.createElement("bdi");   // numbers stay LTR in either script
    num.dir = "ltr"; num.textContent = h.number;
    a.appendChild(num);
    row.appendChild(a);
    row.appendChild(document.createTextNode(" — " + h.name + "، " + h.purpose));
    list.appendChild(row);
  }
  d.appendChild(list);
  scrollDown();
}

/* ---------- composer ------------------------------------------------------ */
function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 170) + "px";
}
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

/* ---------- location (enables TRUE "nearest" by distance) ----------------- */
let coords = null;
function requestLocation(){
  if (!navigator.geolocation) return;          // needs https or localhost
  navigator.geolocation.getCurrentPosition(
    (p) => { coords = { lat: p.coords.latitude, lon: p.coords.longitude }; },
    () => { coords = null; },                  // denied -> backend falls back to town
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 600000 }
  );
}

/* ---------- sending ------------------------------------------------------- */
async function send(text){
  if (busy) return;
  const q = (text || input.value).trim();
  if (!q) return;

  if (!started){
    started = true;
    const op = document.getElementById("open");
    if (op) op.remove();
  }
  document.getElementById("more").textContent = "";

  say(q, "u");
  input.value = ""; autoGrow();
  busy = true; sendBtn.disabled = true;
  typing(true);

  try {
    const r = await fetch(API + "/chat", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      // lang is omitted on purpose: the backend detects it per message.
      body: JSON.stringify({
        channel:"web", text:q, user_ref: await userRef(),
        ...(coords ? { lat: coords.lat, lon: coords.lon } : {}),   // true nearest when shared
      }),
    });
    typing(false);
    if (!r.ok) throw new Error("HTTP " + r.status);
    showAnswer(await r.json());
    followUps();
  } catch (err){
    typing(false);
    const d = say(T.offline, "sys");
    const retry = document.createElement("button");
    retry.type = "button"; retry.textContent = T.retry;
    retry.style.cssText = "font:inherit;background:none;border:0;cursor:pointer;"
      + "color:var(--olive);text-decoration:underline;margin-top:8px;padding:8px 0";
    retry.addEventListener("click", () => { retry.remove(); send(q); });
    d.appendChild(document.createElement("br"));
    d.appendChild(retry);
  } finally {
    busy = false; sendBtn.disabled = false;
    input.focus();
  }
}

document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); send(); });
document.getElementById("langBtn").addEventListener("click", () => {
  applyUi(ui === "ar" ? "en" : "ar"); input.focus();
});
document.getElementById("themeBtn").addEventListener("click", toggleTheme);

/* ---------- boot ---------------------------------------------------------- */
(async function boot(){
  const wanted = new URLSearchParams(location.search).get("lang");
  applyUi(STRINGS[wanted] ? wanted : detectUi());
  input.focus();
  requestLocation();   // ask once; if allowed, "nearest" uses real distance, else town

  try {
    const h = await fetch(API + "/api/hotlines");
    if (h.ok) hotlines = (await h.json()).hotlines || [];
  } catch(e){}

  // Deep link: /?q=... asks a question straight away, so a QR, an SMS or a
  // link from a MoPH page can drop someone into a specific answer.
  const q = new URLSearchParams(location.search).get("q");
  if (q) send(q);
})();
</script>
