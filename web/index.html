<!doctype html>
<!-- Minimal RTL-aware chat widget. Member C replaces/expands this.
     Serve the page, set API to your backend URL. -->
<html lang="ar" dir="auto">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Daleel — دليل</title>
<style>
  body{font-family:system-ui,"Segoe UI",sans-serif;margin:0;background:#E8F2EE}
  #app{max-width:520px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:#fff}
  header{background:#0F5C4A;color:#fff;padding:14px 16px;font-weight:600}
  #log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .m{padding:9px 12px;border-radius:12px;max-width:80%;white-space:pre-wrap}
  .u{align-self:flex-end;background:#2F5D8A;color:#fff}
  .b{align-self:flex-start;background:#F2F6F5;color:#1F2933}
  form{display:flex;gap:8px;padding:10px;border-top:1px solid #ddd}
  input{flex:1;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:15px}
  button{background:#0F5C4A;color:#fff;border:0;border-radius:10px;padding:0 16px;font-size:15px}
</style>
</head>
<body>
<div id="app">
  <header>Daleel · دليل — MoPH Health Assistant</header>
  <div id="log"></div>
  <form id="f"><input id="t" placeholder="اسأل سؤالك… / Ask a question…" autocomplete="off"/><button>➤</button></form>
</div>
<script>
const API = (location.origin || "http://localhost:8000") + "/chat";
const log = document.getElementById("log");
function add(text, who){const d=document.createElement("div");d.className="m "+who;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;}
document.getElementById("f").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const t=document.getElementById("t"); const q=t.value.trim(); if(!q)return;
  add(q,"u"); t.value="";
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({channel:"web",text:q,user_ref:"web-demo"})});
    const a=await r.json();
    add(a.text + (a.sources&&a.sources.length?"\n\n"+a.sources.map(s=>"↗ "+s.url).join("\n"):""),"b");
  }catch(err){add("Network error: "+err,"b");}
});
add("Welcome / أهلاً. Ask about procedures, pharmacies, medicines, or hotlines.","b");
</script>
</body>
</html>
