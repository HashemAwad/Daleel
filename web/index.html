<!doctype html>
<!-- Daleel. Owner: C (tickets C0, C1, C5).
     Arabic-first, RTL, per-message bidi so Arabic, Arabizi, French and English
     read correctly in one thread. Language is detected per message by the
     backend — the reader is never asked to choose.

     Design: the interface is an official record, not a messaging app. Answers
     are entries; the source is a reference line; the cedar appears once, blind-
     embossed, the way a seal sits on ministry letterhead.

     No external assets — the venue network cannot be trusted, so the cedar is
     inline SVG and both typefaces are resident on-device. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#FCFCFA" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)"/>
<title>دليل — وزارة الصحة العامة</title>
<style>
  :root{
    color-scheme: light;
    /* Five values, every one of them taken from the ministry's own lockup. */
    --cedar:#15693A;
    --cedar-deep:#0D4426;
    --seal:#C62127;        /* emergencies and the identity rule. Nowhere else. */
    --ink:#221F1A;
    --ink-2:#4A453D;
    --quiet:#6B655C;
    --paper:#FCFCFA;
    --paper-2:#F4F3EE;     /* the reader's own entry */
    --rule:#DFDCD3;
    --rule-soft:#EBE9E2;
    --amber:#7A5200; --amber-wash:#F7F0DE;
    --seal-wash:#F9EAE9;

    --measure:40rem;
    --swift:cubic-bezier(.2,.65,.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --cedar:#5FB98A; --cedar-deep:#93D8B2; --seal:#FF8F8A;
      --ink:#F0EDE6; --ink-2:#CFCABF; --quiet:#948E83;
      --paper:#14130F; --paper-2:#1D1B16;
      --rule:#302D26; --rule-soft:#23211B;
      --amber:#E2BC72; --amber-wash:#2A2109; --seal-wash:#2E1512;
    }
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    /* Naskh for Arabic, a transitional serif for Latin: one document voice. */
    font-family:"Noto Naskh Arabic","Traditional Arabic","Geeza Pro","SF Arabic",
                "Iowan Old Style",Palatino,"Palatino Linotype",Charter,Georgia,serif;
    font-size:17px; line-height:1.85;   /* serif wants the extra leading */
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .bidi{unicode-bidi:plaintext; text-align:start}
  bdi{unicode-bidi:isolate}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  #app{height:100%; display:flex; flex-direction:column}
  .col{width:100%; max-width:var(--measure); margin-inline:auto; padding-inline:22px}

  /* ---- letterhead ------------------------------------------------------- */
  .letterhead{flex:none; background:var(--paper)}
  .lockup{display:flex; align-items:center; gap:13px; padding-block:13px;
          padding-top:calc(13px + env(safe-area-inset-top))}
  .cedar{width:31px; height:31px; flex:none; fill:var(--cedar); display:block}
  .titles{display:flex; flex-direction:column; line-height:1.2}
  /* Caps here are the ministry's actual logotype, not a decorative eyebrow. */
  .titles span{font-size:10px; font-weight:700; letter-spacing:.11em;
               text-transform:uppercase; font-family:"Iowan Old Style",Palatino,Georgia,serif}
  .t-state{color:var(--cedar)}
  .t-ministry{color:var(--seal)}
  .vrule{width:1px; align-self:stretch; background:var(--rule); margin-inline:5px}
  .svc{font-size:16px; font-weight:600; letter-spacing:.01em}
  .grow{flex:1}
  .letterhead nav{display:flex; gap:19px; font-size:14px}
  .letterhead nav a{
    color:var(--ink-2); text-decoration:none; padding-bottom:2px;
    border-bottom:1px solid transparent; transition:color .2s var(--swift), border-color .2s var(--swift);
  }
  .letterhead nav a:hover{color:var(--cedar); border-bottom-color:var(--cedar)}
  @media (max-width:560px){ .letterhead nav{display:none} }

  /* The identity rule: cedar green, broken by the ministry's red. */
  .band{height:2px; background:var(--cedar); position:relative}
  .band::after{content:""; position:absolute; inset-block:0; inset-inline-start:0;
               width:84px; background:var(--seal)}

  /* ---- record ----------------------------------------------------------- */
  #scroll{flex:1; overflow-y:auto; overscroll-behavior:contain}
  #log{display:flex; flex-direction:column; padding-block:30px 10px}

  .m{max-width:100%; white-space:pre-wrap; overflow-wrap:anywhere}
  .m + .m{margin-top:26px}

  /* The reader's question: indented, ruled on the leading edge — a margin note.
     Not a bubble; bubbles make a ministry read as a chat app. */
  .m.u{
    color:var(--ink-2); font-size:16px;
    padding:4px 15px; margin-inline-start:auto; max-width:82%;
    border-inline-start:2px solid var(--rule);
    background:var(--paper-2);
  }
  /* The answer: full measure, plain, with a cedar tick in the margin. */
  .m.b{position:relative; padding-inline-start:19px}
  .m.b::before{
    content:""; position:absolute; inset-inline-start:0; top:.72em;
    width:7px; height:7px; background:var(--cedar);
    clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  .m.sys{color:var(--quiet); font-size:15px; text-align:center;
         border-block:1px solid var(--rule-soft); padding-block:14px}
  .m.enter{animation:settle .34s var(--swift) both}
  @keyframes settle{from{opacity:0; transform:translateY(5px)}}

  .flag{
    display:inline-block; font-size:13px; font-weight:600;
    padding:1px 9px; margin-bottom:7px;
    border-inline-start:3px solid currentColor;
  }
  .flag.emergency{background:var(--seal-wash); color:var(--seal)}
  .flag.refused,.flag.unanswered{background:var(--amber-wash); color:var(--amber)}

  /* Reference line — reads like a citation on a record, so no label above it. */
  .srcs{margin-top:15px; padding-top:10px; border-top:1px solid var(--rule-soft);
        display:flex; flex-direction:column; gap:5px}
  .src{font-size:14.5px; line-height:1.6; color:var(--quiet)}
  .src a{color:var(--cedar); text-decoration:none;
         border-bottom:1px solid var(--rule); transition:border-color .2s var(--swift)}
  .src a:hover{border-bottom-color:var(--cedar)}
  .src .when{font-size:13.5px}

  .typing{display:flex; gap:5px; align-items:center; height:26px; padding-inline-start:19px}
  .typing i{width:5px; height:5px; border-radius:50%; background:var(--quiet);
            opacity:.3; animation:bob 1.3s var(--swift) infinite}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes bob{30%{opacity:.85; transform:translateY(-3px)}}

  /* ---- opening: the seal ------------------------------------------------ */
  #open{padding-block:9vh 0; position:relative}
  /* Blind emboss: the cedar pressed into the paper rather than printed on it. */
  .seal{
    position:absolute; inset-block-start:5vh; inset-inline-end:-18px;
    width:188px; height:188px; pointer-events:none;
    fill:var(--ink); opacity:.032;
  }
  #open h1{
    font-size:clamp(30px, 7vw, 44px); font-weight:600; line-height:1.3;
    margin:0 0 14px; letter-spacing:-.01em; max-width:19ch;
  }
  #open .lede{margin:0; color:var(--quiet); font-size:16.5px; max-width:36ch}
  .examples{margin-top:34px; border-top:1px solid var(--rule)}
  .ex{
    display:block; width:100%; font:inherit; font-size:16px; cursor:pointer;
    background:none; border:0; border-bottom:1px solid var(--rule-soft);
    color:var(--ink-2); text-align:start; padding:14px 2px 14px 0;
    transition:color .22s var(--swift), padding .28s var(--swift),
               background .22s var(--swift);
  }
  .ex:hover{color:var(--cedar); padding-inline-start:10px; background:var(--paper-2)}
  .ex:active{padding-inline-start:6px}

  /* ---- composer --------------------------------------------------------- */
  .composer{flex:none; background:var(--paper); border-top:1px solid var(--rule)}
  .well{display:flex; align-items:flex-end; gap:10px; padding-block:12px}
  #t{
    flex:1; border:0; outline:0; background:transparent; color:var(--ink);
    font:inherit; resize:none; padding:7px 0; max-height:170px; min-height:26px;
    line-height:1.7;
  }
  #t::placeholder{color:var(--quiet); opacity:.85}
  #send{
    width:40px; height:40px; flex:none; border:0; cursor:pointer;
    background:var(--cedar); color:var(--paper); display:grid; place-items:center;
    transition:background .22s var(--swift), opacity .22s var(--swift), transform .22s var(--swift);
  }
  #send:hover:not(:disabled){background:var(--cedar-deep)}
  #send:active:not(:disabled){transform:scale(.94)}
  #send:disabled{opacity:.28; cursor:default}
  #send svg{width:17px; height:17px; fill:currentColor; display:block}
  .standing{
    font-size:13.5px; color:var(--quiet); line-height:1.6;
    padding-bottom:calc(11px + env(safe-area-inset-bottom));
  }
  .standing b{color:var(--seal); font-weight:700}

  .more{display:flex; gap:20px; padding-block:16px 0; font-size:14.5px}
  .more button{
    font:inherit; background:none; border:0; cursor:pointer; color:var(--ink-2);
    padding:0 0 2px; border-bottom:1px solid var(--rule);
    transition:color .2s var(--swift), border-color .2s var(--swift);
  }
  .more button:hover{color:var(--cedar); border-bottom-color:var(--cedar)}

  :is(button,a,textarea):focus-visible{outline:2px solid var(--cedar); outline-offset:3px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="cedar" viewBox="0 0 64 64">
  <path d="M32 3 L21.5 17h5.5L18.5 29h6L10 43h18.5v18h7V43H54L39.5 29h6L37 17h5.5Z"/>
</symbol></svg>

<div id="app">
  <div class="letterhead">
    <div class="col lockup">
      <svg class="cedar" aria-hidden="true"><use href="#cedar"/></svg>
      <div class="titles">
        <span class="t-state" lang="en">Republic of Lebanon</span>
        <span class="t-ministry" lang="en">Ministry of Public Health</span>
      </div>
      <div class="vrule" aria-hidden="true"></div>
      <span class="svc">دليل</span>
      <div class="grow"></div>
      <nav>
        <a href="/join">واتساب</a>
        <a href="/dashboard">الإحصاءات</a>
      </nav>
    </div>
    <div class="band" aria-hidden="true"></div>
  </div>

  <div id="scroll">
    <div class="col">
      <section id="open">
        <svg class="seal" aria-hidden="true"><use href="#cedar"/></svg>
        <h1>اسأل عن أي معاملة أو دواء أو مستشفى</h1>
        <p class="lede">اكتب بالعربية، بالعامية المكتوبة بالأحرف اللاتينية، بالفرنسية أو بالإنكليزية. نجيب من المصادر الرسمية فقط.</p>
        <div class="examples" id="examples"></div>
      </section>

      <div id="log" role="log" aria-live="polite" aria-label="المحادثة"></div>
      <div class="more" id="more"></div>
    </div>
  </div>

  <div class="composer">
    <div class="col">
      <form id="f" autocomplete="off">
        <label class="sr" for="t">اكتب سؤالك</label>
        <div class="well">
          <textarea id="t" rows="1" dir="auto" class="bidi" enterkeyhint="send"
                    placeholder="اكتب سؤالك هنا"></textarea>
          <button id="send" type="submit" aria-label="إرسال">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l15-7-4.5 7L19 19z"/></svg>
          </button>
        </div>
      </form>
      <p class="standing" dir="auto">
        معلومات رسمية فقط. لا نقدّم نصائح طبية أو جرعات. للطوارئ اتصل بالرقم <b><bdi dir="ltr">140</bdi></b>.
      </p>
    </div>
  </div>
</div>

<script>
"use strict";
const API     = (location.origin || "http://localhost:8000");
const log     = document.getElementById("log");
const scroller= document.getElementById("scroll");
const input   = document.getElementById("t");
const sendBtn = document.getElementById("send");
const opening = document.getElementById("open");

let hotlines = [];
let busy = false;
let started = false;

const CALM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function scrollDown(){
  scroller.scrollTo({ top: scroller.scrollHeight, behavior: CALM ? "auto" : "smooth" });
}

/* ---------- identity: an opaque session ref, never anything personal ------ */
const REF_KEY = "daleel_user_ref";
async function userRef(){
  let ref = null;
  try { ref = localStorage.getItem(REF_KEY); } catch(e){}
  if (ref) return ref;
  try {
    const r = await fetch(API + "/api/session");
    ref = (await r.json()).user_ref;
  } catch(e){
    ref = "web_local_" + Math.random().toString(36).slice(2,12);
  }
  try { localStorage.setItem(REF_KEY, ref); } catch(e){}
  return ref;
}

/* ---------- entries ------------------------------------------------------- */
function entry(who){
  const d = document.createElement("div");
  d.className = "m " + who + " bidi" + (CALM ? "" : " enter");
  d.setAttribute("dir","auto");          // per-message direction detection
  log.appendChild(d);
  scrollDown();
  return d;
}

function say(text, who){
  const d = entry(who);
  d.textContent = text;                   // textContent: never inject markup
  scrollDown();
  return d;
}

const FLAGS = {
  emergency:  "طوارئ",
  refused:    "لا نصائح طبية",
  unanswered: "لا يوجد مصدر رسمي",
};

function showAnswer(a){
  const d = entry("b");

  if (FLAGS[a.outcome]){
    const f = document.createElement("span");
    f.className = "flag " + a.outcome;
    f.textContent = FLAGS[a.outcome];
    d.appendChild(f);
    d.appendChild(document.createElement("br"));
  }

  const body = document.createElement("span");
  body.setAttribute("dir","auto");
  body.className = "bidi";
  body.textContent = a.text || "";
  d.appendChild(body);

  const srcs = (a.sources || []).filter(s => s && s.url);
  const isDir = a.tool === "directory";
  if (srcs.length || isDir){
    const wrap = document.createElement("div");
    wrap.className = "srcs";
    const seen = new Set();
    for (const s of srcs){
      if (seen.has(s.url)) continue;
      seen.add(s.url);
      const row = document.createElement("div");
      row.className = "src bidi";
      row.setAttribute("dir","auto");
      row.appendChild(document.createTextNode("المصدر: "));

      const link = document.createElement("a");
      link.href = s.url;                  // href only; text is set separately
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = s.title || s.url;
      row.appendChild(link);

      if (s.checked_on){
        const when = document.createElement("span");
        when.className = "when";
        when.appendChild(document.createTextNode("، روجع في "));
        const d2 = document.createElement("bdi");
        d2.dir = "ltr";
        d2.textContent = s.checked_on;
        when.appendChild(d2);
        row.appendChild(when);
      }
      wrap.appendChild(row);
    }

    // Facility data is OpenStreetMap, licensed ODbL — attribution is a licence
    // condition, so it ships with every directory answer, sources or not.
    if (isDir){
      const credit = document.createElement("div");
      credit.className = "src";
      credit.setAttribute("dir", "ltr");
      const cl = document.createElement("a");
      cl.href = "https://www.openstreetmap.org/copyright";
      cl.target = "_blank";
      cl.rel = "noopener noreferrer";
      cl.textContent = "© OpenStreetMap contributors";
      credit.appendChild(cl);
      wrap.appendChild(credit);
    }
    d.appendChild(wrap);
  }

  scrollDown();
}

function typing(on){
  let el = document.getElementById("typing");
  if (on && !el){
    el = document.createElement("div");
    el.id = "typing";
    el.className = "m b typing";
    el.innerHTML = "<i></i><i></i><i></i>";
    el.setAttribute("aria-label","يكتب");
    log.appendChild(el);
    scrollDown();
  } else if (!on && el){
    el.remove();
  }
}

/* ---------- openers -------------------------------------------------------
   Four languages on the first screen, because showing that mixing is expected
   works better than a picker telling the reader to choose one. */
const EXAMPLES = [
  "كيف أجدّد دفتر الدواء المزمن؟",
  "أقرب صيدلية في عاليه",
  "kif 2a2dar la2i mosta2fa 7koume 2arib?",
  "Combien coûte le Concor 5 ?",
];

function openers(){
  const bar = document.getElementById("examples");
  bar.textContent = "";
  for (const text of EXAMPLES){
    const b = document.createElement("button");
    b.type = "button"; b.className = "ex bidi";
    b.setAttribute("dir","auto");
    b.textContent = text;
    b.addEventListener("click", () => send(text));
    bar.appendChild(b);
  }
}

function followUps(){
  const bar = document.getElementById("more");
  bar.textContent = "";
  const items = [["اسأل سؤالاً آخر", () => { bar.textContent = ""; input.focus(); }],
                 ["أرقام الطوارئ", showHotlines]];
  for (const [label, fn] of items){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.addEventListener("click", fn);
    bar.appendChild(b);
  }
}

function showHotlines(){
  const d = entry("b");
  const head = document.createElement("div");
  head.className = "bidi"; head.setAttribute("dir","auto");
  head.textContent = "أرقام الطوارئ والخطوط الساخنة";
  d.appendChild(head);

  const list = document.createElement("div");
  list.className = "srcs";
  const rows = hotlines.length ? hotlines : [
    { name:"الخط الساخن لوزارة الصحة", number:"1787", purpose:"معلومات صحية عامة" },
    { name:"الصليب الأحمر اللبناني",    number:"140",  purpose:"طوارئ وإسعاف" },
  ];
  for (const h of rows){
    const row = document.createElement("div");
    row.className = "src bidi"; row.setAttribute("dir","auto");
    const a = document.createElement("a");
    a.href = "tel:" + h.number;
    const num = document.createElement("bdi");   // numbers stay LTR inside RTL text
    num.dir = "ltr"; num.textContent = h.number;
    a.appendChild(num);
    row.appendChild(a);
    row.appendChild(document.createTextNode(" — " + h.name + "، " + h.purpose));
    list.appendChild(row);
  }
  d.appendChild(list);
  scrollDown();
}

/* ---------- composer ------------------------------------------------------ */
function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 170) + "px";
}
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

/* ---------- sending ------------------------------------------------------- */
async function send(text){
  if (busy) return;
  const q = (text || input.value).trim();
  if (!q) return;

  if (!started){ started = true; opening.remove(); }
  document.getElementById("more").textContent = "";

  say(q, "u");
  input.value = ""; autoGrow();
  busy = true; sendBtn.disabled = true;
  typing(true);

  try {
    const r = await fetch(API + "/chat", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      // lang is omitted on purpose: the backend detects it per message.
      body: JSON.stringify({ channel:"web", text:q, user_ref: await userRef() }),
    });
    typing(false);
    if (!r.ok) throw new Error("HTTP " + r.status);
    showAnswer(await r.json());
    followUps();
  } catch (err){
    typing(false);
    const d = say("الخدمة غير متاحة الآن. تحقق من اتصالك ثم أعد المحاولة.", "sys");
    const retry = document.createElement("button");
    retry.type = "button"; retry.textContent = "أعد المحاولة";
    retry.style.cssText = "font:inherit;background:none;border:0;cursor:pointer;"
      + "color:var(--cedar);border-bottom:1px solid var(--rule);margin-top:8px;padding:0 0 2px";
    retry.addEventListener("click", () => { retry.remove(); send(q); });
    d.appendChild(document.createElement("br"));
    d.appendChild(retry);
  } finally {
    busy = false; sendBtn.disabled = false;
    input.focus();
  }
}

document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); send(); });

/* ---------- boot ---------------------------------------------------------- */
(async function boot(){
  openers();
  input.focus();

  try {
    const h = await fetch(API + "/api/hotlines");
    if (h.ok) hotlines = (await h.json()).hotlines || [];
  } catch(e){}

  // Deep link: /?q=... asks a question straight away, so a QR, an SMS or a
  // link from a MoPH page can drop someone into a specific answer.
  const q = new URLSearchParams(location.search).get("q");
  if (q) send(q);
})();
</script>
</body>
</html>
